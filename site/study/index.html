<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study — Construction Study Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Hepta+Slab:wght@400;600;700&family=Red+Hat+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
/* Study 원장은 첫 열이 대표 사진이라 조금 넓다 (유형 표시는 오른쪽 meta 칸이 맡는다) */
.ledger-row { --ledger-cols:120px 1fr 130px 140px; } /* 제목·설명이 짧아져 meta 열은 "External link" 가 들어갈 만큼만 둔다 */
.ledger-row .thumb { width:120px; height:80px; object-fit:cover; border-radius:var(--radius); display:block; background:var(--surface2); }
.ledger-row .thumb-soon { border:1px dashed var(--faint); background:transparent; }
@media (max-width:700px) {
  .ledger-row { --ledger-cols:84px 1fr; }
  .ledger-row .thumb { width:84px; height:56px; }
  /* 좁은 화면에서 theme.css 가 .is-soon 의 meta·soon 을 숨긴다. 예전에는 첫 칸 배지가 "Soon" 을 말해줬지만
     이제 그 자리가 빈 상자라 행이 아무 말도 하지 않는다 — 본문 열에 한 번만 다시 보여준다. */
  .ledger-row.is-soon .soon { display:block; grid-column:2; text-align:left; }
}
</style>
</head>
<body class="section-page">
<header class="appbar"><div class="appbar-inner appbar-inner--wide">
  <a class="logo" href="../">Construction Study Lab</a>
  <nav class="appbar-nav" aria-label="Sections">
    <a href="../labs/">Lab</a>
    <a href="./" class="is-active" aria-current="page">Study</a>
  </nav>
</div></header>

<section class="band-royal section-head">
  <div>
    <p class="eyebrow" style="margin:0">02 · Notes and references</p>
    <h1>Study</h1>
  </div>
  <p>Lecture notes, reference tables, and worked examples to read alongside the labs.</p>
</section>

<main id="groups" class="section-main"></main>

<footer class="site-footer">
  <span>© <span id="year"></span> Jisoo Park. All rights reserved.</span>
  <a href="../">← Home</a>
</footer>

<script src="../shared/registry.js"></script>
<script src="../shared/dom.js"></script>
<script>
'use strict';
const S = window.SITE;

const TYPE_LABEL = { pdf: 'PDF', link: 'Link', page: 'Page' };

let rowsDrawn = 0; // 처음 두 장은 화면에 바로 보이므로 lazy 로 늦추지 않는다
function itemRow(m) {
  const external = m.type === 'link';
  // 첫 칸은 대표 사진. 바로 옆 제목이 같은 내용을 말하므로 장식 이미지로 두고 alt 는 비운다.
  const lead = m.thumb
    ? h('img', { class: 'thumb', src: m.thumb, alt: '', width: 360, height: 240, loading: rowsDrawn++ < 2 ? 'eager' : 'lazy' })
    : h('div', { class: 'type' }, TYPE_LABEL[m.type] || m.type);
  return h('div', { class: 'ledger-row is-active' }, lead,
    h('div', {}, h('h3', { class: 'title' }, m.title), h('p', { class: 'desc' }, m.desc)),
    h('div', { class: 'meta' }, m.type === 'pdf' ? 'PDF' : m.type === 'link' ? 'External link' : 'Page'),
    h('a', Object.assign({ class: 'btn btn-primary', href: m.href }, external ? { target: '_blank', rel: 'noopener' } : {}), 'Open →'));
}
function soonRow() {
  return h('div', { class: 'ledger-row is-soon' },
    h('div', { class: 'thumb thumb-soon' }),
    h('div', {}, h('h3', { class: 'title' }, 'Lecture notes and reference tables will appear here.')),
    h('div', { class: 'meta' }, '—'),
    h('div', { class: 'soon' }, 'Soon'));
}
// 카드 사진은 각 글에 실린 사진의 일부다 — CC BY·BY-SA 는 쓰이는 자리마다 저작자 표시가 필요하므로 목록 끝에 한 문단을 둔다
function credits() {
  const deed = (href, text) => h('a', { href, rel: 'license noopener', target: '_blank' }, text);
  return h('p', { class: 'ref-note' },
    'Card photographs are details from the images credited on each article page, which link the original files: Habib M’henni ',
    deed('https://creativecommons.org/licenses/by/4.0/', 'CC BY 4.0'), ' and ',
    deed('https://creativecommons.org/licenses/by-sa/3.0/', 'CC BY-SA 3.0'), '; W.carter ',
    deed('https://creativecommons.org/licenses/by-sa/4.0/', 'CC BY-SA 4.0'), '; Nixdorf ',
    deed('https://creativecommons.org/licenses/by/4.0/', 'CC BY 4.0'),
    '; Xb-70 and the Federal Highway Administration, public domain — all via Wikimedia Commons. ',
    'The mix design worked example uses an illustration from ',
    h('a', { href: 'https://pixabay.com/service/license-summary/', rel: 'license noopener', target: '_blank' }, 'Pixabay'), '.');
}

function render() {
  const root = document.getElementById('groups');
  root.innerHTML = '';
  for (const g of S.STUDY_GROUPS) {
    const items = S.MATERIALS.filter(m => m.group === g.id);
    root.append(h('section', { class: 'group', id: `study-${g.id}` },
      h('div', { class: 'group-head' }, h('h2', {}, g.name), h('p', {}, g.blurb)),
      ...(items.length ? items.map(itemRow) : [soonRow()])));
  }
  root.append(credits());
  document.getElementById('year').textContent = new Date().getFullYear();
}
render();
</script>
</body>
</html>
