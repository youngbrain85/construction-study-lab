<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab — Construction Study Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Hepta+Slab:wght@400;600;700&family=Red+Hat+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="modulepreload" href="../shared/vendor/three.module.js">
<link rel="modulepreload" href="mix-design/scene3d.js">
<link rel="stylesheet" href="../shared/theme.css">
</head>
<body class="section-page room-page">
<header class="appbar"><div class="appbar-inner appbar-inner--wide">
  <a class="logo" href="../">Construction Study Lab</a>
  <nav class="appbar-nav" aria-label="Sections">
    <a href="./" class="is-active" aria-current="page">Lab</a>
    <a href="../study/">Study</a>
  </nav>
</div></header>

<main class="room-main">
  <h1 class="visually-hidden">Lab</h1>
  <div class="room-viewport" id="room" role="region" aria-label="Virtual construction lab">
    <div class="room-caption">
      <p class="eyebrow">01 · Interactive labs</p>
      <p class="room-hint">Pick a station · drag to look around</p>
    </div>
    <div class="room-labels" id="room-labels"></div>
    <div class="room-fade" aria-hidden="true"></div>
  </div>
  <div id="fallback" class="section-main" hidden></div>
</main>

<footer class="site-footer">
  <span>© <span id="year"></span> Jisoo Park. All rights reserved.</span>
  <a href="../">← Home</a>
</footer>

<script src="../shared/registry.js"></script>
<script src="../shared/dom.js"></script>
<script src="lab-list.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear(); // 경로와 무관하게 항상
  // 3D 모듈이 12 s 안에 body.room-page--3d 를 붙이지 못하면(404·구문 오류 등) 대체 목록을 띄운다
  window.__labRoomGuard = setTimeout(function () {
    if (!document.body.classList.contains('room-page--3d')) LabList.showFallback('module-timeout');
  }, 12000);
</script>
<script nomodule>LabList.showFallback('nomodule');</script>
<script type="module" src="room/lab-room.js" onerror="LabList.showFallback('module-error')"></script>
</body>
</html>
