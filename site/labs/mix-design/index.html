<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Design Lab — Construction Study Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Hepta+Slab:wght@400;600;700&family=Red+Hat+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
/* ── Mix Design Lab 모듈 전용 스타일 ──────────────────────────────
   공통 디자인 시스템은 shared/theme.css 로 이동했다. 이 모듈에 남은
   CSS는 현재 없으며(모든 클래스가 다른 랩과 공유되는 범용 컴포넌트),
   추후 이 모듈만의 스타일이 필요해지면 여기에 추가한다. */

/* COMPRESSION 장면 전용: 디지털 로드 인디케이터(7-seg풍 어두운 패널, 스펙 §3.3) */
.utm-load-panel { position:absolute; right:16px; top:16px; width:190px;
  background:#12151b; border:2px solid #3d414a; border-radius:var(--radius); padding:10px 12px;
  font-family:var(--font-mono); pointer-events:none; }
.utm-load-panel .title { color:#7d8797; font:700 11px/1.4 var(--font); letter-spacing:.04em; }
.utm-load-panel .readout { font-size:26px; font-weight:700; letter-spacing:.06em; margin-top:4px;
  text-shadow:0 0 6px currentColor; }
.utm-load-panel .readout.psi { color:#5ee88a; }
.utm-load-panel .readout.lbf { color:#ffb454; font-size:19px; margin-top:8px; }
.utm-load-panel .label { color:#98a1b0; font:500 12px var(--font); margin-top:2px; }
.utm-graph-wrap { position:absolute; right:16px; top:172px; }
.utm-done-list { position:absolute; right:16px; bottom:14px; text-align:right;
  font:600 14px var(--font); color:var(--green); pointer-events:none; }
.utm-done-list .avg { color:var(--text); font-weight:700; margin-top:2px; }
</style>
</head>
<body>
<header class="appbar"><div class="appbar-inner">
  <div class="logo"><a href="../">← All Labs</a> Mix Design Lab</div>
  <div id="appbar-info"></div>
</div></header>
<main id="stage"></main>
<script src="engine.js"></script>
<script type="module" src="scene3d.js"></script>
<script>
'use strict';
const E = MixEngine;

// ── DOM 빌더 ──────────────────────────────────────────────────────
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(9)) {
    if (c == null) continue;
    el.append(c.nodeType ? c : document.createTextNode(c));
  }
  return el;
}
const fmtNmas = (n) => ({ 0.375: '3/8"', 0.5: '1/2"', 0.75: '3/4"', 1: '1"', 1.5: '1-1/2"' })[n];

// ── 게임 상태 ─────────────────────────────────────────────────────
const game = {
  mission: null, design: null, result: null, seed: 1,
  newRun(mission) {
    this.mission = mission;
    this.design = { slumpTarget: null, nmas: null, isAE: false, water: null,
      airPct: null, wc: null, cement: null, ca: null, fa: null,
      vCm: null, vWater: null, vCa: null, vAir: null }; // vCm/vWater/vCa/vAir는 Step 7 절대용적법 워크시트 전용 — 판정(designToMix)에는 쓰지 않는다
    this.result = null;
    this.seed = Math.floor(Math.random() * 1e6);
  },
};
function designToMix() {
  const d = game.design;
  return { water: d.water, cement: d.cement, ca: d.ca, fa: d.fa,
    airPct: d.airPct, nmas: d.nmas, isAE: d.isAE, aggShape: game.mission.aggShape };
}
function bestScores() {
  try { return JSON.parse(localStorage.getItem('mixlab-best') || '{}'); }
  catch (e) { return {}; }
}

// ── 장면 상태머신 ─────────────────────────────────────────────────
const Stage = document.getElementById('stage');
const Scenes = {};
let currentScene = null;
function go(name) {
  if (currentScene && currentScene.unmount) currentScene.unmount();
  Stage.innerHTML = '';
  window.scrollTo(0, 0);
  setAppbar();
  currentScene = Scenes[name]();
  currentScene.mount(Stage);
}
function setAppbar() {
  const info = document.getElementById('appbar-info');
  info.innerHTML = '';
  if (game.mission) {
    const m = game.mission;
    info.append(h('span', { class: 'badge badge-blue' },
      `${m.icon} ${m.name} · f'c ${m.fc.toLocaleString()} psi`));
  }
}

// ── HOME: 미션 선택 ───────────────────────────────────────────────
Scenes.home = () => ({
  mount(root) {
    const best = bestScores();
    root.append(
      h('h1', {}, 'Concrete Mix Design Challenge'),
      h('p', { class: 'sub' },
        'Pick a project, proportion your mix with the ACI 211.1 tables, then put it to the test.'),
      h('div', { class: 'mission-grid' },
        E.MISSIONS.map(m => h('div', { class: 'card mission-card', onclick: () => { game.newRun(m); go('design'); } },
          h('div', { class: 'icon' }, m.icon),
          h('h2', {}, m.name),
          h('div', { class: 'meta' },
            h('span', { class: 'badge badge-blue' }, `f'c ${m.fc.toLocaleString()} psi`),
            h('span', { class: 'badge badge-blue' }, `Slump ${m.slumpRange[0]}–${m.slumpRange[1]} in.`),
            m.exposure !== 'none' ? h('span', { class: 'badge badge-amber' }, '❄ Air-entrained') : null,
            best[m.id] != null ? h('span', { class: 'badge badge-green' }, `Best ${best[m.id]}`) : null),
          h('div', { class: 'desc' }, m.desc),
          h('button', { class: 'btn btn-primary' }, 'Start Mission →')))));
  },
});

// ── 참고표 렌더러 ─────────────────────────────────────────────────
function refTable(caption, head, rows, note) {
  return h('div', { class: 'card' },
    h('table', { class: 'ref-table' },
      h('caption', {}, caption),
      h('thead', {}, h('tr', {}, head.map(c => h('th', {}, c)))),
      h('tbody', {}, rows.map(r => h('tr', {}, r.map(c => h('td', {}, String(c))))))),
    note ? h('div', { class: 'ref-note' }, note) : null);
}

// ── 위저드 내비게이션 상태 ────────────────────────────────────────
// renderDesign()이 매번 새로 만드는 Next 버튼을 여기에 저장해두고,
// 숫자 입력 중에는 전체 재렌더 없이 이 버튼의 disabled만 갱신한다.
// (전체 재렌더는 DOM을 파괴해 클릭·포커스가 유실되는 문제가 있었음)
let wizNextBtn = null;
// Step 7(절대용적법 워크시트) 전용 라이브 표시줄. render()가 요소를 만들어 여기 저장해두면,
// numField의 input 이벤트가 부르는 updateWizNav()가 재렌더 없이 텍스트만 갱신한다.
let vFineLine = null;
function updateVFineLine() {
  if (!vFineLine) return; // 다른 스텝에서는 요소가 없으므로 아무 것도 하지 않는다
  const d = game.design;
  const vals = [d.vCm, d.vWater, d.vCa, d.vAir];
  if (vals.every(v => v != null)) {
    const sum = vals.reduce((a, b) => a + b, 0);
    vFineLine.textContent = `V_fine = 1.000 − ${sum.toFixed(3)} = ${(1 - sum).toFixed(3)} cu yd`;
  } else {
    vFineLine.textContent = 'V_fine = —';
  }
}
function updateWizNav() {
  updateVFineLine();
  if (!wizNextBtn) return;
  wizNextBtn.disabled = !STEP_DEFS[designStep].ready();
}

// ── 숫자 입력 (클램프 + NaN 복원) ─────────────────────────────────
function numField({ label, key, unit, min, max, step, hint }) {
  const input = h('input', { type: 'number', min, max, step: step || 'any',
    value: game.design[key] ?? '' });
  // 타이핑 중(input): 파싱 성공 시 클램프해 라이브 커밋만 하고, 화면(input.value)과
  // 전체 트리는 건드리지 않는다 — 재렌더가 DOM을 새로 만들면 다음 키 입력이나
  // Next 클릭이 사라진 옛 요소를 향하게 되어 클릭 삼켜짐·포커스 유실이 발생했다.
  input.addEventListener('input', () => {
    const v = parseFloat(input.value);
    if (!Number.isNaN(v)) game.design[key] = Math.min(max, Math.max(min, v));
    updateWizNav(); // Next 버튼 상태만 갱신
  });
  // blur(change): 최종값을 클램프해 input.value에 반영. NaN이면 이전 값으로 복원.
  // 여기서도 재렌더는 하지 않는다(포커스 이동 중 DOM 파괴 방지).
  input.addEventListener('change', () => {
    const v = parseFloat(input.value);
    if (Number.isNaN(v)) { input.value = game.design[key] ?? ''; updateWizNav(); return; } // NaN → 이전 값 복원
    const c = Math.min(max, Math.max(min, v));
    game.design[key] = c;
    input.value = c;
    updateWizNav(); // Next 버튼 상태만 갱신
  });
  return h('div', { class: 'num-field' },
    h('label', {}, label, h('div', { class: 'wrap' }, input, h('span', { class: 'unit' }, unit))),
    hint ? h('div', { class: 'hint' }, hint) : null);
}

// ── 재료 물성 카드 (상시 표시) ────────────────────────────────────
// 미션의 굵은골재 형상(aggShape)에 따라 라벨에 형상 문구를 덧붙인다.
const AGG_SHAPE_LABEL = { rounded: 'Well-rounded river gravel', crushed: 'Crushed stone (angular)' };
function materialsCard() {
  const M = E.DATA.MAT;
  const shape = game.mission ? AGG_SHAPE_LABEL[game.mission.aggShape] : null;
  return refTable('Materials Lab Report',
    ['Property', 'Value'],
    [['Cement specific gravity', M.sgCement],
     ['Coarse aggregate', shape ? `${M.sgCA} SG (SSD) — ${shape}` : `${M.sgCA} SG (SSD)`],
     ['Coarse agg. dry-rodded unit weight', M.druwCA + ' lb/cu ft'],
     ['Coarse agg. absorption', (M.absCA * 100).toFixed(1) + '%'],
     ['Fine agg. specific gravity (SSD)', M.sgFA],
     ['Fine agg. fineness modulus', M.fmSand.toFixed(2)],
     ['Fine agg. absorption', (M.absFA * 100).toFixed(1) + '%']],
    'All aggregates assumed at SSD condition.');
}

// ── 스텝 정의 (1–2) ───────────────────────────────────────────────
// 강의 Slide 8 표: Member/placement별 권장 슬럼프 범위 (in.)
const SLUMP_RECOMMEND = [
  ['Footings and slabs', 2, 5],
  ['Beams and reinforced walls', 3, 5],
  ['Building columns', 3, 5],
];
const STEP_DEFS = [
  {
    id: 'slump', title: 'Step 1 — Choose the target slump', sub:
      'Consult the table and pick a slump consistent with your project. The mission spec is the governing requirement.',
    render(box) {
      box.append(numField({ label: 'Design slump', key: 'slumpTarget', unit: 'in.',
        min: 0.5, max: 8, step: 0.25,
        hint: `Mission requires ${game.mission.slumpRange[0]}–${game.mission.slumpRange[1]} in.` }));
    },
    refPanels: () => [refTable('Recommended slumps for various types of construction',
      ['Member / placement', 'Min (in.)', 'Max (in.)'],
      SLUMP_RECOMMEND.map(r => [r[0], r[1], r[2]]),
      'Maximum slump may be increased 1 in. when consolidation is not by vibration.')],
    ready: () => game.design.slumpTarget != null,
  },
  {
    id: 'nmas', title: 'Step 2 — Maximum aggregate size', sub:
      'Choose the largest nominal maximum size available for this project.',
    render(box) {
      box.append(h('div', { class: 'choice-row' },
        game.mission.nmasAllowed.map(n =>
          h('button', {
            class: 'choice' + (game.design.nmas === n ? ' selected' : ''),
            'aria-pressed': game.design.nmas === n ? 'true' : 'false',
            onclick: () => { game.design.nmas = n; renderDesign(); },
          }, fmtNmas(n)))));
    },
    refPanels: () => [refTable('Nominal maximum sizes available at the plant',
      ['Size', 'Note'],
      game.mission.nmasAllowed.map(n => [fmtNmas(n), 'in stock']),
      'Rule of thumb: NMAS ≤ 1/5 of the narrowest form dimension, ≤ 3/4 of clear rebar spacing, ≤ 1/3 of slab depth.')],
    ready: () => game.design.nmas != null,
  },
  {
    id: 'water', title: 'Step 3 — Mixing water and air content', sub:
      'Read the water requirement for your slump and aggregate size. Decide whether this mix needs air entrainment.',
    render(box) {
      const d = game.design;
      const aeBtn = (on, lbl) => h('button', {
        class: 'choice' + (d.isAE === on ? ' selected' : ''),
        'aria-pressed': d.isAE === on ? 'true' : 'false',
        onclick: () => { d.isAE = on; renderDesign(); } }, lbl);
      box.append(
        h('div', { class: 'num-field' }, h('label', {}, 'Mix type'),
          h('div', { class: 'choice-row' }, aeBtn(false, 'Non-air-entrained'), aeBtn(true, 'Air-entrained'))),
        numField({ label: 'Mixing water', key: 'water', unit: 'lb/cu yd', min: 100, max: 500, step: 1 }),
        numField({ label: 'Target air content', key: 'airPct', unit: '%', min: 0, max: 10, step: 0.5,
          hint: 'Non-AE mixes still trap some air — see the table.' }));
    },
    refPanels: () => {
      const W = E.DATA.WATER_TABLE, nmasCols = E.DATA.NMAS_LIST;
      const head = ['Slump (in.)', ...nmasCols.map(fmtNmas)];
      const slumpRows = ['1 to 2', '3 to 4', '6 to 7'];
      const body = (kind) => slumpRows.map((lbl, i) => [lbl, ...nmasCols.map(n => W[kind][n][i])]);
      const MORE_THAN_7 = ['More than 7*', ...nmasCols.map(() => '—')];
      const INTERP_NOTE = 'For slumps between the listed ranges, interpolate between rows. '
        + 'Rule of thumb (ACI 6.3.9.1): ±10 lb of water per 1 in. of slump. '
        + '*Slumps above 7 in. require water-reducing admixtures.';
      return [
        refTable('Approximate mixing water (lb/cu yd) — non-air-entrained', head,
          [...body('nonAE'), MORE_THAN_7, ['Entrapped air (%)', ...nmasCols.map(n => W.entrappedAir[n])]],
          INTERP_NOTE),
        refTable('Approximate mixing water (lb/cu yd) — air-entrained', head,
          [...body('ae'), MORE_THAN_7,
           ['Target air, mild exposure (%)', ...nmasCols.map(n => W.targetAir[n][0])],
           ['Target air, moderate (%)', ...nmasCols.map(n => W.targetAir[n][1])],
           ['Target air, severe (%)', ...nmasCols.map(n => W.targetAir[n][2])]],
          INTERP_NOTE),
        h('div', { class: 'card' },
          h('strong', {}, 'Aggregate shape correction: '),
          'Angular/crushed: use the table value as-is. Well-rounded gravel: start with an 8% reduction.'),
      ];
    },
    ready: () => game.design.water != null && game.design.airPct != null,
  },
  {
    id: 'wc', title: 'Step 4 — Water-cement ratio', sub:
      "Pick the w/c that delivers the required average strength. Interpolate between rows if needed.",
    render(box) {
      box.append(numField({ label: 'Water-cement ratio', key: 'wc', unit: 'by weight',
        min: 0.25, max: 1.0, step: 0.01,
        hint: `Assume no acceptable strength record. Read the f'cr table first, then pick w/cm. `
          + `This mission: f'c ${game.mission.fc.toLocaleString()} → f'cr ${E.fcrFor(game.mission.fc).toLocaleString()} psi.` }));
    },
    refPanels: () => {
      const T = E.DATA.WC_TABLE;
      return [
        refTable("Required average strength f'cr (no strength record)",
          ["Specified f'c (psi)", "Required f'cr (psi)"],
          [["f'c < 3,000", "f'c + 1,000"], ["3,000 ≤ f'c ≤ 5,000", "f'c + 1,200"], ["f'c > 5,000", "1.1 × f'c + 700"]]),
        refTable('Relationship between w/c and compressive strength',
          ["28-day f'c (psi)", 'Non-AE', 'Air-entrained'],
          T.strengths.map((fc, i) => [fc.toLocaleString(), T.nonAE[i].toFixed(2), T.ae[i] == null ? '—' : T.ae[i].toFixed(2)]),
          'Strengths are for concrete containing no more air than the table amounts.'),
      ];
    },
    ready: () => game.design.wc != null,
  },
  {
    id: 'cement', title: 'Step 5 — Cement content', sub:
      'Compute the cement content from your water content and w/c ratio, then enter it.',
    render(box) {
      box.append(
        h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;margin-bottom:4px' },
          h('strong', {}, 'Formula: '), 'cement = water ÷ (w/c)'),
        numField({ label: 'Cement content', key: 'cement', unit: 'lb/cu yd', min: 200, max: 1200, step: 1 }));
    },
    refPanels: () => [],
    ready: () => game.design.cement != null,
  },
  {
    id: 'coarse', title: 'Step 6 — Coarse aggregate', sub:
      'Read the dry-rodded bulk volume fraction for your aggregate size and sand fineness modulus, then convert to weight.',
    render(box) {
      box.append(
        h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;margin-bottom:4px' },
          h('div', {}, h('strong', {}, 'Formula: '), 'OD weight = (b/b₀) × 27 cu ft × dry-rodded unit weight'),
          h('div', {}, 'SSD weight = OD × (1 + absorption)')),
        numField({ label: 'Coarse aggregate (SSD basis)', key: 'ca', unit: 'lb/cu yd', min: 0, max: 2500, step: 1 }));
    },
    refPanels: () => {
      const T = E.DATA.CA_VOLUME_TABLE;
      return [refTable('Volume of dry-rodded coarse aggregate per unit volume of concrete',
        ['NMAS', ...T.fm.map(f => 'FM ' + f.toFixed(2))],
        E.DATA.NMAS_LIST.map(n => [fmtNmas(n), ...T[n].map(v => v.toFixed(2))]),
        'Interpolate for fineness modulus values between columns.')];
    },
    ready: () => game.design.ca != null,
  },
  {
    id: 'fine', title: 'Step 7 — Fine aggregate (absolute volume method)', sub:
      'Convert every other ingredient to absolute volume, then find the fine aggregate volume by difference.',
    render(box) {
      const d = game.design, M = E.DATA.MAT;
      const KEYS = ['vCm', 'vWater', 'vCa', 'vAir'];
      const WS = E.DATA.WORKSHEET_LB_PER_YD3.toLocaleString('en-US'); // 화면 공식과 엔진 상수를 한 곳에서 맞춘다
      // 이 단계를 표시할 때마다 앞 단계(3~6) 값으로 네 부피를 다시 계산해 덮어쓴다.
      // 앞 단계를 고치고 돌아와도 기본값이 항상 앞 단계와 일치한다(이 네 값은 판정에 쓰이지 않는다).
      // 단계에 머무는 동안에는 재렌더가 없으므로 학생이 직접 고친 값은 그대로 남는다.
      const before = KEYS.map(k => d[k]);
      const V = E.absoluteVolumes(d);
      for (const k of KEYS) if (V[k] != null) d[k] = V[k];
      // 부피가 달라졌으면 이미 적어 둔 잔골재 값은 더 이상 그 합에서 나온 값이 아니다 —
      // 지워서 다시 계산하게 한다(안 그러면 V_fine 줄과 모순된 채로 Review 로 넘어가 수율 점수를 잃는다).
      if (KEYS.some((k, i) => before[i] != null && before[i] !== d[k])) d.fa = null;
      const q = (v) => (v == null ? '—' : v.toLocaleString('en-US')); // 힌트에 쓸 앞 단계 값(식 안에 들어가므로 로캘 고정)
      box.append(
        h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;margin-bottom:4px' },
          h('div', {}, h('strong', {}, 'Formula: '), `V (cu yd) = mass ÷ (relative density × ${WS})`),
          h('div', {}, 'V_air = air% ÷ 100'),
          h('div', {}, 'V_fine = 1.000 − ΣV'),
          h('div', { class: 'ref-note' },
            'The four volumes below are carried over from steps 3–6. Edit any of them to work the conversion yourself.')),
        numField({ label: 'Cementitious volume', key: 'vCm', unit: 'cu yd', min: 0, max: 1, step: 0.001,
          hint: `${q(d.cement)} ÷ (${M.sgCement} × ${WS})` }),
        numField({ label: 'Water volume', key: 'vWater', unit: 'cu yd', min: 0, max: 1, step: 0.001,
          hint: `${q(d.water)} ÷ (1.00 × ${WS})` }),
        numField({ label: 'Coarse agg. volume', key: 'vCa', unit: 'cu yd', min: 0, max: 1, step: 0.001,
          hint: `${q(d.ca)} ÷ (${M.sgCA} × ${WS})` }),
        numField({ label: 'Air volume', key: 'vAir', unit: 'cu yd', min: 0, max: 1, step: 0.001,
          hint: `${q(d.airPct)}% ÷ 100` }));
      // 라이브 표시줄: 요소는 여기서 한 번만 만들고, 이후 갱신은 updateWizNav() → updateVFineLine()가 담당한다
      vFineLine = h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;font-weight:600' }, 'V_fine = —');
      box.append(vFineLine,
        numField({ label: 'Fine aggregate (SSD basis)', key: 'fa', unit: 'lb/cu yd', min: 0, max: 2500, step: 1 }));
      updateVFineLine(); // 스텝을 다시 방문했을 때 기존 입력값을 즉시 반영
    },
    refPanels: () => [], // 참고표 없음 — materialsCard()의 비중(RD) 값만 사용
    ready: () => game.design.vCm != null && game.design.vWater != null && game.design.vCa != null
      && game.design.vAir != null && game.design.fa != null,
  },
];

      h('div', { class: 'dot' }, i < designStep ? '✓' : String(i + 1)),
      h('div', { class: 'lbl' }, s.id.toUpperCase())))));
  // 본문 2컬럼
  const box = h('div', { class: 'card' }, h('h2', {}, def.title), h('p', { class: 'sub' }, def.sub));
  vFineLine = null; // 재렌더 시 이전 스텝(7)의 표시줄 참조를 정리 — 현재 스텝이 'fine'이면 render()가 즉시 새로 채운다

  wizNextBtn = nextBtn; // numField가 재렌더 없이 이 버튼 상태만 갱신할 수 있도록 모듈 변수에 저장

    nextBtn));
  designRoot.append(h('div', { class: 'wizard-grid' }, box,
    h('div', { class: 'ref-panel' }, def.refPanels(), materialsCard())));
}

// ── 캔버스 공통 ───────────────────────────────────────────────────
function canvasStage(w, hgt, ariaLabel) {
  const dpr = window.devicePixelRatio || 1;
  const canvas = h('canvas', { class: 'canvas-stage', width: w * dpr, height: hgt * dpr,
    style: `max-width:${w}px`, role: 'img', 'aria-label': ariaLabel || 'Animation' });
  const ctx = canvas.getContext('2d');
  if (!ctx) return { canvas, ctx: null }; // Canvas 미지원 환경 — 호출부에서 텍스트 폴백으로 전환
  ctx.scale(dpr, dpr);
  return { canvas, ctx };
}
const easeOutCubic = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
function sceneShell(root, title, sub, canvas, actions) {
  root.append(h('h1', {}, title), h('p', { class: 'sub' }, sub), canvas,
    h('div', { class: 'stage-actions' }, actions));
}
// Canvas 미지원 시 공통 텍스트 폴백: 애니메이션 대신 카드로 수치 결과를 보여주고
// 다음 장면 버튼을 즉시 활성화한다 (스펙 §6 "Canvas 미지원 시 텍스트 결과 폴백").
function canvasFallback(root, title, sub, resultNodes, nextLabel, onNext) {
  root.append(h('h1', {}, title), h('p', { class: 'sub' }, sub),
    h('div', { class: 'card' }, resultNodes),
    h('div', { class: 'stage-actions' },
      h('button', { class: 'btn btn-primary', onclick: onNext }, nextLabel)));
}

// ── MIX: 드럼 믹서(Scene3D 3D 소비) ──────────────────────────────────
// 3D 지오메트리·애니메이션은 scene3d.js의 Scene3D.buildMixerScene()이 전담한다.
// 이 파일은 스테이지 생성 + HTML 오버레이(캡션) + 버튼 계약 + 폴백만 담당한다.
// 캡션 경계는 buildMixerScene()이 반환하는 mixer.stageBreaks를 그대로 소비한다
// (하드코딩 배열과 STAGE_BOUNDS를 따로 유지하며 생기던 동기화 위험 제거).
const MIX_CAPTIONS = ['Adding cement…', 'Adding water…', 'Adding aggregates…', 'Mixing…'];
Scenes.mix = () => {
  let stage = null, start = 0;
  const mix = designToMix();
  const wc = mix.cement > 0 ? mix.water / mix.cement : 1.2;
  return {
    mount(root) {
      const S3 = window.Scene3D;
      if (!S3 || !S3.ready) {
        canvasFallback(root, 'Batching & mixing', 'One cubic yard, coming up.',
          h('p', {}, 'Mixing complete.'), 'Continue to Slump Test →', () => go('slump'));
        return;
      }
      const container = h('div', { class: 'canvas-stage',
        style: 'position:relative;width:100%;max-width:900px;aspect-ratio:900/460;overflow:hidden' });
      stage = S3.createStage(container, {
        w: 900, h: 460, fov: 42,
        cameraPos: { x: 2.9, y: 2.1, z: 3.6 }, target: { x: 0, y: 0.82, z: 0 },
      });
      if (!stage) {
        canvasFallback(root, 'Batching & mixing', 'One cubic yard, coming up.',
          h('p', {}, 'Mixing complete.'), 'Continue to Slump Test →', () => go('slump'));
        return;
      }
      const THREE = S3.THREE;
      stage.renderer.domElement.setAttribute('role', 'img');
      stage.renderer.domElement.setAttribute('aria-label', 'Concrete drum mixer animation');

      const rng = E.mulberry32(7); // 시드 고정 — 골재 배치(계약: MixEngine.mulberry32만 사용)
      const mixer = S3.buildMixerScene({ wc, rng });
      stage.scene.add(mixer.group);
      const captionBounds = mixer.stageBreaks; // buildMixerScene 내부 STAGE_BOUNDS 실값(하드코딩 대신 직접 소비)

      const caption = h('div', { style: 'position:absolute;left:0;right:0;top:10px;text-align:center;' +
        'font:600 14px var(--font);color:var(--muted);pointer-events:none' }, MIX_CAPTIONS[0]);
      container.append(caption);

      const nextBtn = h('button', { class: 'btn btn-primary', onclick: () => go('slump') },
        'Continue to Slump Test →');
      nextBtn.disabled = true;
      sceneShell(root, 'Batching & mixing', 'One cubic yard, coming up.', container,
        [h('button', { class: 'btn btn-ghost', onclick: () => go('slump') }, 'Skip'), nextBtn]);

      // 카메라 미세 orbit(±3°) — target 기준 구면좌표 오프셋을 저장해두고 방위각만 사인 진동시킨다
      const target = new THREE.Vector3(0, 0.82, 0);
      const camOffset = stage.camera.position.clone().sub(target);
      const orbitRadiusXZ = Math.hypot(camOffset.x, camOffset.z);
      const baseAzimuth = Math.atan2(camOffset.x, camOffset.z);
      function applyCameraOrbit(t) {
        const az = baseAzimuth + THREE.MathUtils.degToRad(3) * Math.sin(t * 0.6);
        stage.camera.position.set(
          target.x + orbitRadiusXZ * Math.sin(az),
          target.y + camOffset.y,
          target.z + orbitRadiusXZ * Math.cos(az));
        stage.camera.lookAt(target);
      }

      function renderFrame(t) {
        mixer.update(t);
        applyCameraOrbit(t);
        stage.renderer.render(stage.scene, stage.camera);
        const idx = t < captionBounds[0] ? 0 : t < captionBounds[1] ? 1 : t < captionBounds[2] ? 2 : 3;
        caption.textContent = MIX_CAPTIONS[idx];
        if (t >= 4 && nextBtn.disabled) nextBtn.disabled = false;
      }

      stage.setLoop((now) => {
        if (!start) start = now;
        renderFrame((now - start) / 1000);
      });

      // 검증 훅(스펙 §1) — 마운트 중에만 노출, 히든 페인에서 수동 렌더+픽셀 검증용
      window.__scene3dDebug = { renderAt: renderFrame, renderer: stage.renderer };
    },
    unmount() {
      delete window.__scene3dDebug;
      if (stage) { stage.dispose(); stage = null; } // stop + disposeDeep(scene) + renderer.dispose + DOM 제거
    },
  };
};

// ── SLUMP: 슬럼프 시험(ASTM C143, Scene3D 3D 소비) ────────────────
// 3D 지오메트리·애니메이션은 scene3d.js의 Scene3D.buildSlumpScene()이 전담한다.
// 이 파일은 스테이지 생성 + 페이즈/타이밍 산정 + HTML 오버레이 + 버튼 계약 +
// 폴백만 담당한다(믹서 장면과 동일한 역할 분리 패턴).
const SLUMP_MODE_BADGE = { zero: ['badge-amber', 'Zero slump — too dry'],
  true: ['badge-green', 'True slump'],
  shear: ['badge-amber', 'Shear slump — harsh mix'],
  collapse: ['badge-red', 'Collapse — too wet'] };
Scenes.slump = () => {
  let stage = null, start = 0, finished = false; // finished: 측정 완료+배지 표시 후 루프 정지
  const r = game.result; // { behavior:{mode,slump,segregation}, measuredSlump } — 불변 계약: 엔진 재계산 금지, 그대로 소비만 한다
  const modeBadge = SLUMP_MODE_BADGE[r.behavior.mode];
  return {
    mount(root) {
      const fallback = () => canvasFallback(root, 'Slump test (ASTM C143)',
        'Fill in three lifts, rod each 25 times, lift the cone — and watch.',
        h('div', {},
          h('p', {}, `Slump: ${r.measuredSlump.toFixed(2)} in.`),
          h('span', { class: 'badge ' + modeBadge[0] }, modeBadge[1])),
        'Proceed to Strength Test →', () => go('compression'));

      const S3 = window.Scene3D;
      if (!S3 || !S3.ready) { fallback(); return; }
      const container = h('div', { class: 'canvas-stage',
        style: 'position:relative;width:100%;max-width:900px;aspect-ratio:900/470;overflow:hidden' });
      stage = S3.createStage(container, {
        w: 900, h: 470, fov: 44,
        cameraPos: { x: 1.9, y: 2.05, z: 3.7 }, target: { x: 0.9, y: 0.75, z: 0 },
      });
      if (!stage) { fallback(); return; }
      const THREE = S3.THREE;
      stage.renderer.domElement.setAttribute('role', 'img');
      stage.renderer.domElement.setAttribute('aria-label', 'Concrete slump test animation');

      const rng = E.mulberry32(29); // 시드 고정 — 골재 배치(계약: MixEngine.mulberry32만 사용)
      const slumpScene = S3.buildSlumpScene({
        mode: r.behavior.mode, slump: r.behavior.slump,
        measuredSlump: r.measuredSlump, segregation: r.behavior.segregation, rng,
      });
      stage.scene.add(slumpScene.group);
      const T = slumpScene.timing;
      const FILL_END = T.FILL_DUR, LIFT_END = FILL_END + T.LIFT_DUR,
        SETTLE_END = LIFT_END + T.SETTLE_DUR;

      const overlay = h('div', { style: 'position:absolute;left:0;right:0;top:10px;text-align:center;' +
        'font:600 14px var(--font);color:var(--muted);pointer-events:none' });
      const overlaySub = h('div', { style: 'position:absolute;left:0;right:0;top:32px;text-align:center;' +
        'font:500 12px var(--font-mono);color:var(--faint);pointer-events:none' });
      container.append(overlay, overlaySub);

      const info = h('div', { class: 'stage-actions', style: 'min-height:34px' });
      const nextBtn = h('button', { class: 'btn btn-primary', onclick: () => go('compression') },
        'Proceed to Strength Test →');
      nextBtn.style.display = 'none';
      sceneShell(root, 'Slump test (ASTM C143)',
        'Fill in three lifts, rod each 25 times, lift the cone — and watch.', container, [nextBtn]);
      root.insertBefore(info, root.querySelector('.stage-actions'));

      // 전역 경과시간 t → 페이즈 판정 + 페이즈-로컬 (localT, p) 산출. p는 이징 적용된
      // 진행도(0→1)이며 scene3d.buildSlumpScene.update()가 그대로 소비한다.
      function renderFrame(t) {
        let phase, localT, p;
        if (t < FILL_END) { phase = 'fill'; localT = t; p = localT / T.FILL_DUR; }
        else if (t < LIFT_END) { phase = 'lift'; localT = t - FILL_END; p = easeOutCubic(localT / T.LIFT_DUR); }
        else if (t < SETTLE_END) { phase = 'settle'; localT = t - LIFT_END; p = easeOutCubic(localT / T.SETTLE_DUR); }
        else { phase = 'measure'; localT = Math.min(t - SETTLE_END, T.MEASURE_DUR); p = easeOutCubic(localT / T.MEASURE_DUR); }

        const info3d = slumpScene.update(phase, localT, p);
        stage.renderer.render(stage.scene, stage.camera);

        if (phase === 'fill') {
          overlay.textContent = info3d.rodding
            ? `Lift ${info3d.layerIdx + 1} of 3 — Rodding… ${info3d.rodCount} / 25`
            : `Lift ${info3d.layerIdx + 1} of 3 — placing concrete…`;
          overlaySub.textContent = '';
        } else if (phase === 'lift') {
          overlay.textContent = `Lifting: ${localT.toFixed(1)} s`;
          overlaySub.textContent = 'ASTM C143 §8.2 — raise the mold in 5 ± 2 s, straight up, no lateral or torsional motion';
        } else if (phase === 'settle') {
          overlay.textContent = 'Concrete settling…';
          overlaySub.textContent = '';
        } else { // measure
          overlay.textContent = p >= 1 ? `Slump: ${r.measuredSlump.toFixed(2)} in.` : 'Measuring the slump…';
          overlaySub.textContent = '';
          if (p >= 1 && !finished) {
            finished = true; // 측정 완료+배지 표시 프레임을 마지막으로 그린 뒤 루프 정지
            info.append(h('span', { class: 'badge ' + modeBadge[0] }, modeBadge[1]));
            nextBtn.style.display = '';
            stage.stop();
          }
        }
      }

      stage.setLoop((now) => {
        if (!start) start = now;
        renderFrame((now - start) / 1000);
      });

      // 검증 훅(스펙 §1) — 마운트 중에만 노출, 히든 페인에서 수동 렌더+픽셀 검증용
      window.__scene3dDebug = { renderAt: renderFrame, renderer: stage.renderer };
    },
    unmount() {
      delete window.__scene3dDebug;
      if (stage) { stage.dispose(); stage = null; } // stop + disposeDeep(scene) + renderer.dispose + DOM 제거
    },
  };
};

// ── COMPRESSION: 압축강도 시험(ASTM C39, Scene3D 3D 소비) ──────────
// 3D 지오메트리·애니메이션(2포스트 UTM 프레임·유압 램·공시체·파괴 유형·양생
// 몰드)은 scene3d.js의 Scene3D.buildUtmScene()이 전담한다. 이 파일은 스테이지
// 생성 + 타임라인(cast→cure→3본 순차 재하) 판정 + stressAt·피크 고정·done
// 캐치업 로직(불변 계약 — 구 2D 버전에서 값 그대로 이식) + HTML 오버레이
// (7-seg풍 판독 패널·그래프 캔버스·Day 카운터·완료 목록) + 버튼 계약 + 폴백만
// 담당한다(믹서·슬럼프 장면과 동일한 역할 분리 패턴).
Scenes.compression = () => {
  let stage = null, start = 0, finished = false; // finished: 3본 완료+Average 표시 후 루프 정지
  const r = game.result; // 불변 계약: game.result만 소비(f28, cylinders[3], avgStrength, behavior.segregation) — 엔진 재계산 금지
  const AREA = 28.27; // 6" 지름 공시체 단면적 (in²) — 불변 계약
  function stressAt(fp, eps) { // Hognestad 응력-변형률 모델(불변 계약) — 상승 포물선(e0=0.002) / 하강 선형(기울기 0.35)
    const e0 = 0.002, x = eps / e0;
    if (x <= 1) return fp * (2 * x - x * x);
    return Math.max(0, fp * (1 - 0.35 * (eps - e0) / 0.0018));
  }
  const failMode = r.behavior.segregation ? 'crumble' : (r.f28 >= 5000 ? 'columnar' : 'cone'); // 불변 계약 로직 유지
  const CYL_T = 2.6;      // 공시체당 재하 시간(초) — 불변 계약
  const testStart = 3.5;  // cast(1.5s)+cure(2s) — 불변 계약
  const done = [];        // 파괴 완료된 공시체 강도 — 불변 계약

  return {
    mount(root) {
      const fallback = () => canvasFallback(root, 'Compression test (ASTM C39)',
        'Three 6×12 cylinders, 28 days moist-cured, loaded to failure.',
        h('div', {},
          r.cylinders.map((s, i) => h('p', {}, `#${i + 1}: ${Math.round(s).toLocaleString()} psi`)),
          h('p', { style: 'font-weight:700' }, `Average: ${Math.round(r.avgStrength).toLocaleString()} psi`)),
        'See Final Report →', () => go('results'));

      const S3 = window.Scene3D;
      if (!S3 || !S3.ready) { fallback(); return; }
      const container = h('div', { class: 'canvas-stage',
        style: 'position:relative;width:100%;max-width:900px;aspect-ratio:900/470;overflow:hidden' });
      stage = S3.createStage(container, {
        w: 900, h: 470, fov: 38,
        cameraPos: { x: 2.4, y: 1.7, z: 3.0 }, target: { x: 0, y: 0.65, z: 0.2 },
      });
      if (!stage) { fallback(); return; }
      stage.renderer.domElement.setAttribute('role', 'img');
      stage.renderer.domElement.setAttribute('aria-label', 'Concrete cylinder compression test animation');

      const rng = E.mulberry32(41); // 시드 고정 — 파편/골재 배치(계약: MixEngine.mulberry32만 사용)
      const utm = S3.buildUtmScene({ failMode, rng });
      stage.scene.add(utm.group);

      // ── 오버레이: 상단 캡션 + Day 카운터(양생 중) + 로드 패널 + 그래프 + 완료 목록 ──
      const caption = h('div', { style: 'position:absolute;left:0;right:0;top:10px;text-align:center;' +
        'font:600 14px var(--font);color:var(--muted);pointer-events:none' });
      const dayNum = h('div', { style: 'font:700 44px var(--font);color:var(--text)' });
      const dayBox = h('div', { style: 'position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);' +
        'text-align:center;pointer-events:none;display:none' },
        dayNum, h('div', { style: 'font:500 13px var(--font-mono);color:var(--muted);margin-top:4px' }, '73 °F · 100% RH'));

      const psiReadout = h('div', { class: 'readout psi' }, '0');
      const psiLabel = h('div', { class: 'label' }, '0 psi');
      const lbfReadout = h('div', { class: 'readout lbf' }, '0');
      const lbfLabel = h('div', { class: 'label' }, '0 lbf');
      const loadPanel = h('div', { class: 'utm-load-panel', style: 'display:none' },
        h('div', { class: 'title' }, 'LOAD INDICATOR'), psiReadout, psiLabel, lbfReadout, lbfLabel);

      // 응력-변형률 그래프: 오버레이 내 2D <canvas>(구 drawGraph 로직 이식, 클리핑 유지)
      const { canvas: graphCanvas, ctx: graphCtx } = canvasStage(190, 130, 'Stress-strain graph');
      graphCanvas.style.width = '190px'; graphCanvas.style.height = '130px'; // .canvas-stage의 width:100% 상쇄
      const graphWrap = h('div', { class: 'utm-graph-wrap', style: 'display:none' }, graphCanvas);

      const doneList = h('div', { class: 'utm-done-list' });

      container.append(caption, dayBox, loadPanel, graphWrap, doneList);

      const nextBtn = h('button', { class: 'btn btn-primary', onclick: () => go('results') },
        'See Final Report →');
      nextBtn.style.display = 'none';
      sceneShell(root, 'Compression test (ASTM C39)',
        'Three 6×12 cylinders, 28 days moist-cured, loaded to failure.', container, [nextBtn]);

      function drawGraph(fp, epsNow) {
        // 응력-변형률 미니 그래프(하강부는 실제 eps로 그린다 — 불변 계약, 구 drawGraph 로직 이식)
        if (!graphCtx) return;
        const cs = getComputedStyle(document.documentElement);
        const tok = v => cs.getPropertyValue(v).trim();   // Canvas 2D는 var()를 못 읽는다 — 토큰을 문자열로 전달
        const gw = 190, gh = 130, gx = 4, gy = 4, pw = gw - 34, ph = gh - 26;
        graphCtx.clearRect(0, 0, gw, gh);
        graphCtx.strokeStyle = tok('--border'); graphCtx.lineWidth = 1.5;
        graphCtx.strokeRect(gx, gy, pw, ph);
        graphCtx.fillStyle = tok('--muted'); graphCtx.font = `500 10px ${tok('--font-mono')}`; graphCtx.textAlign = 'center';
        graphCtx.fillText('strain', gx + pw / 2, gy + ph + 14);
        graphCtx.save(); graphCtx.translate(gx - 10, gy + ph / 2); graphCtx.rotate(-Math.PI / 2);
        graphCtx.fillText('stress (psi)', 0, 0); graphCtx.restore();
        graphCtx.save(); graphCtx.beginPath(); graphCtx.rect(gx, gy, pw, ph); graphCtx.clip(); // 산포로 fp가 yMax 초과 시 곡선이 그래프 박스 밖으로 새는 것을 방지(클리핑 유지)
        graphCtx.strokeStyle = tok('--primary'); graphCtx.lineWidth = 2; graphCtx.beginPath();
        const yMax = r.f28 * 1.15 || 1000;
        for (let e = 0; e <= epsNow; e += 0.00004) {
          const px2 = gx + (e / 0.0038) * pw;
          const py2 = gy + ph - (stressAt(fp, e) / yMax) * ph;
          e === 0 ? graphCtx.moveTo(px2, py2) : graphCtx.lineTo(px2, py2);
        }
        graphCtx.stroke();
        graphCtx.restore();
      }

      function updateDoneList() {
        doneList.innerHTML = '';
        done.forEach((s, i) => doneList.append(h('div', {}, `#${i + 1}: ${Math.round(s).toLocaleString()} psi`)));
        if (done.length === 3) {
          doneList.append(h('div', { class: 'avg' }, `Average: ${Math.round(r.avgStrength).toLocaleString()} psi`));
        }
      }

      // 전역 경과시간 t → 페이즈 판정(cast/cure/test) + 재하 진행 수치 산출.
      // stressAt·타임라인·failMode·피크 고정·done 캐치업은 전부 구 2D 버전의 값을
      // 그대로 유지한다(불변 계약) — 3D 갱신(squash/crackProgress/cylinderVisible)과
      // HTML 오버레이만 이 프레임 안에서 새로 배선한다.
      function renderFrame(t) {
        let phase, idx = 0, prog = 0, fp = 0, eps = 0, displaySigma = 0, squash = 0, crackProgress = 0, day = 1;
        if (t < 1.5) {
          phase = 'cast';
        } else if (t < testStart) {
          phase = 'cure';
          day = Math.min(28, Math.max(1, Math.round(((t - 1.5) / 2) * 28)));
        } else {
          phase = 'test';
          idx = Math.min(2, Math.floor((t - testStart) / CYL_T));
          prog = Math.min(1, ((t - testStart) - idx * CYL_T) / (CYL_T * 0.92));
          fp = r.cylinders[idx];
          eps = prog * 0.0038; // 그래프용 실제 변형률(하강부 포함)
          // 큰 판독기(psi/lbf)는 피크(0.002) 이후에도 값이 되돌아 내려가지 않도록 고정 표시(v1 fix, 불변 계약)
          displaySigma = stressAt(fp, Math.min(eps, 0.002));
          squash = Math.min(10, prog * 12);
          crackProgress = Math.min(1, Math.max(0, (eps - 0.002) / 0.0016));
        }

        utm.update(t, squash, crackProgress, phase === 'test');
        stage.renderer.render(stage.scene, stage.camera);

        if (phase === 'cast') {
          caption.textContent = 'Casting cylinders…';
          dayBox.style.display = 'none'; loadPanel.style.display = 'none'; graphWrap.style.display = 'none';
        } else if (phase === 'cure') {
          caption.textContent = 'Moist curing…';
          dayBox.style.display = ''; dayNum.textContent = `Day ${day}`;
          loadPanel.style.display = 'none'; graphWrap.style.display = 'none';
        } else {
          caption.textContent = `Cylinder ${idx + 1} of 3`;
          dayBox.style.display = 'none';
          loadPanel.style.display = ''; graphWrap.style.display = '';
          const psiInt = Math.round(displaySigma), lbfInt = Math.round(displaySigma * AREA); // 불변 계약 포맷(toLocaleString)
          psiReadout.textContent = String(psiInt); psiLabel.textContent = `${psiInt.toLocaleString()} psi`;
          lbfReadout.textContent = String(lbfInt); lbfLabel.textContent = `${lbfInt.toLocaleString()} lbf`;
          drawGraph(fp, eps);

          // idx보다 낮은 회차는 시간상 재하가 이미 끝났음이 확정되므로(idx는 증가만 함),
          // 프레임 점프(백그라운드 탭 스로틀·GC 히치 등)로 등식이 어긋나도 소프트락 없이 캐치업(v1 fix, 불변 계약)
          while (done.length < idx && done.length < 3) done.push(r.cylinders[done.length]);
          if (prog >= 1 && done.length === idx && done.length < 3) done.push(r.cylinders[idx]);
          updateDoneList();
          if (done.length === 3 && !finished) {
            finished = true; // Average 표시 프레임을 마지막으로 그린 뒤 루프 정지
            nextBtn.style.display = '';
            stage.stop();
          }
        }
      }

      stage.setLoop((now) => {
        if (!start) start = now;
        renderFrame((now - start) / 1000);
      });

      // 검증 훅(스펙 §1) — 마운트 중에만 노출, 히든 페인에서 수동 렌더+픽셀 검증용
      window.__scene3dDebug = { renderAt: renderFrame, renderer: stage.renderer };
    },
    unmount() {
      delete window.__scene3dDebug;
      if (stage) { stage.dispose(); stage = null; } // stop + disposeDeep(scene) + renderer.dispose + DOM 제거
    },
  };
};

// ── RESULTS: 결과 리포트 ──────────────────────────────────────────
Scenes.results = () => ({
  mount(root) {
    const r = game.result, m = game.mission, sc = r.score;
    // 최고 기록 갱신
    try {
      const best = bestScores();
      if (!best[m.id] || best[m.id] < sc.total) {
        best[m.id] = sc.total;
        localStorage.setItem('mixlab-best', JSON.stringify(best));
      }
    } catch (e) { /* 저장 불가 환경 무시 */ }

    const gradeColor = { A: 'var(--green)', B: 'var(--primary)', C: 'var(--amber)',
      D: 'var(--amber)', F: 'var(--red)' }[sc.grade];
    const row = (label, detail, pts, max) => h('div', { class: 'score-row' },
      h('div', { style: 'font-weight:600' }, label),
      h('div', {},
        h('div', { style: 'font-size:13px;color:var(--muted);margin-bottom:5px' }, detail),
        h('div', { class: 'score-bar' },
          h('div', { style: `width:${(pts / max) * 100}%;background:${pts === max ? 'var(--green)' : pts > 0 ? 'var(--amber)' : 'var(--red)'}` }))),
      h('div', { style: 'text-align:right;font-weight:700;font-variant-numeric:tabular-nums' },
        `${Math.round(pts)} / ${max}`));

    const target = E.targetAirFor(m, designToMix().nmas);
    root.append(
      h('h1', {}, 'Inspection report'),
      h('p', { class: 'sub' }, `${m.icon} ${m.name} — final verdict from the testing lab.`),
      h('div', { class: 'wizard-grid' },
        h('div', { class: 'card' },
          h('div', { style: 'display:flex;gap:22px;align-items:center;margin-bottom:14px' },
            h('div', { class: 'grade-badge', style: `background:${gradeColor}` }, sc.grade),
            h('div', {},
              h('div', { style: 'font-size:30px;font-weight:800' }, `${sc.total} / 100`),
              h('div', { style: 'font-size:20px;letter-spacing:2px;color:var(--amber)' },
                '★'.repeat(sc.stars) + '☆'.repeat(5 - sc.stars)))),
          row('Slump', `Measured ${r.measuredSlump.toFixed(2)} in. · required ${m.slumpRange[0]}–${m.slumpRange[1]} in.`,
            sc.slumpPts, 40),
          row('Strength', `Average ${Math.round(r.avgStrength).toLocaleString()} psi · required f'c ${m.fc.toLocaleString()} psi`,
            sc.strengthPts, 40),
          row('Air content', `Batched ${designToMix().airPct}%` + (target ? ` · target ${target}%` : ' · non-AE mix'),
            sc.airPts, 10),
          row('Yield', `Absolute volume ${r.yieldVol.toFixed(2)} cu ft · target 27.0 cu ft`,
            sc.yieldPts, 10),
          h('div', { class: 'wiz-nav' },
            h('button', { class: 'btn', onclick: () => { game.result = null; game.seed = Math.floor(Math.random() * 1e6); go('design'); } },
              '↻ Retry mission'),
            h('button', { class: 'btn btn-primary', onclick: () => { game.mission = null; go('home'); } },
              'New mission →'))),
        h('div', { class: 'ref-panel' },
          h('div', { class: 'card' },
            h('h2', {}, "Inspector's notes"),
            h('ul', { style: 'margin:8px 0 0;padding-left:18px;color:var(--muted)' },
              sc.notes.map(n => h('li', { style: 'margin-bottom:8px' }, n)))))));
  },
});

go('home');
</script>
