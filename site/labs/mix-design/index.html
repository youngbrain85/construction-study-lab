<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Design Lab — Construction Study Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
/* ── Mix Design Lab 모듈 전용 스타일 ──────────────────────────────
   공통 디자인 시스템은 shared/theme.css 로 이동했다. 이 모듈에 남은
   CSS는 현재 없으며(모든 클래스가 다른 랩과 공유되는 범용 컴포넌트),
   추후 이 모듈만의 스타일이 필요해지면 여기에 추가한다. */
</style>
</head>
<body>
<header class="appbar"><div class="appbar-inner">
  <div class="logo"><a href="../../" style="color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;margin-right:4px">← All Labs</a> <span class="mark">⬢</span> MixLab</div>
  <div id="appbar-info"></div>
</div></header>
<main id="stage"></main>
<script src="engine.js"></script>
<script>
'use strict';
const E = MixEngine;

// ── DOM 빌더 ──────────────────────────────────────────────────────
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(9)) {
    if (c == null) continue;
    el.append(c.nodeType ? c : document.createTextNode(c));
  }
  return el;
}
const fmtNmas = (n) => ({ 0.375: '3/8"', 0.5: '1/2"', 0.75: '3/4"', 1: '1"', 1.5: '1-1/2"' })[n];

// ── 게임 상태 ─────────────────────────────────────────────────────
const game = {
  mission: null, design: null, result: null, seed: 1,
  newRun(mission) {
    this.mission = mission;
    this.design = { slumpTarget: null, nmas: null, isAE: false, water: null,
      airPct: null, wc: null, cement: null, ca: null, fa: null,
      vCm: null, vWater: null, vCa: null, vAir: null }; // vCm/vWater/vCa/vAir는 Step 7 절대용적법 워크시트 전용 — 판정(designToMix)에는 쓰지 않는다
    this.result = null;
    this.seed = Math.floor(Math.random() * 1e6);
  },
};
function designToMix() {
  const d = game.design;
  return { water: d.water, cement: d.cement, ca: d.ca, fa: d.fa,
    airPct: d.airPct, nmas: d.nmas, isAE: d.isAE, aggShape: game.mission.aggShape };
}
function bestScores() {
  try { return JSON.parse(localStorage.getItem('mixlab-best') || '{}'); }
  catch (e) { return {}; }
}

// ── 장면 상태머신 ─────────────────────────────────────────────────
const Stage = document.getElementById('stage');
const Scenes = {};
let currentScene = null;
function go(name) {
  if (currentScene && currentScene.unmount) currentScene.unmount();
  Stage.innerHTML = '';
  window.scrollTo(0, 0);
  setAppbar();
  currentScene = Scenes[name]();
  currentScene.mount(Stage);
}
function setAppbar() {
  const info = document.getElementById('appbar-info');
  info.innerHTML = '';
  if (game.mission) {
    const m = game.mission;
    info.append(h('span', { class: 'badge badge-blue' },
      `${m.icon} ${m.name} · f'c ${m.fc.toLocaleString()} psi`));
  }
}

// ── HOME: 미션 선택 ───────────────────────────────────────────────
Scenes.home = () => ({
  mount(root) {
    const best = bestScores();
    root.append(
      h('h1', {}, 'Concrete Mix Design Challenge'),
      h('p', { class: 'sub' },
        'Pick a project, proportion your mix with the ACI 211.1 tables, then put it to the test.'),
      h('div', { class: 'mission-grid' },
        E.MISSIONS.map(m => h('div', { class: 'card mission-card', onclick: () => { game.newRun(m); go('design'); } },
          h('div', { class: 'icon' }, m.icon),
          h('h2', {}, m.name),
          h('div', { class: 'meta' },
            h('span', { class: 'badge badge-blue' }, `f'c ${m.fc.toLocaleString()} psi`),
            h('span', { class: 'badge badge-blue' }, `Slump ${m.slumpRange[0]}–${m.slumpRange[1]} in.`),
            m.exposure !== 'none' ? h('span', { class: 'badge badge-amber' }, '❄ Air-entrained') : null,
            best[m.id] != null ? h('span', { class: 'badge badge-green' }, `Best ${best[m.id]}`) : null),
          h('div', { class: 'desc' }, m.desc),
          h('button', { class: 'btn btn-primary' }, 'Start Mission →')))));
  },
});

// ── 참고표 렌더러 ─────────────────────────────────────────────────
function refTable(caption, head, rows, note) {
  return h('div', { class: 'card' },
    h('table', { class: 'ref-table' },
      h('caption', {}, caption),
      h('thead', {}, h('tr', {}, head.map(c => h('th', {}, c)))),
      h('tbody', {}, rows.map(r => h('tr', {}, r.map(c => h('td', {}, String(c))))))),
    note ? h('div', { class: 'ref-note' }, note) : null);
}

// ── 위저드 내비게이션 상태 ────────────────────────────────────────
// renderDesign()이 매번 새로 만드는 Next 버튼을 여기에 저장해두고,
// 숫자 입력 중에는 전체 재렌더 없이 이 버튼의 disabled만 갱신한다.
// (전체 재렌더는 DOM을 파괴해 클릭·포커스가 유실되는 문제가 있었음)
let wizNextBtn = null;
// Step 7(절대용적법 워크시트) 전용 라이브 표시줄. render()가 요소를 만들어 여기 저장해두면,
// numField의 input 이벤트가 부르는 updateWizNav()가 재렌더 없이 텍스트만 갱신한다.
let vFineLine = null;
function updateVFineLine() {
  if (!vFineLine) return; // 다른 스텝에서는 요소가 없으므로 아무 것도 하지 않는다
  const d = game.design;
  const vals = [d.vCm, d.vWater, d.vCa, d.vAir];
  if (vals.every(v => v != null)) {
    const sum = vals.reduce((a, b) => a + b, 0);
    vFineLine.textContent = `V_fine = 1.000 − ${sum.toFixed(3)} = ${(1 - sum).toFixed(3)} cu yd`;
  } else {
    vFineLine.textContent = 'V_fine = —';
  }
}
function updateWizNav() {
  updateVFineLine();
  if (!wizNextBtn) return;
  wizNextBtn.disabled = !STEP_DEFS[designStep].ready();
}

// ── 숫자 입력 (클램프 + NaN 복원) ─────────────────────────────────
function numField({ label, key, unit, min, max, step, hint }) {
  const input = h('input', { type: 'number', min, max, step: step || 'any',
    value: game.design[key] ?? '' });
  // 타이핑 중(input): 파싱 성공 시 클램프해 라이브 커밋만 하고, 화면(input.value)과
  // 전체 트리는 건드리지 않는다 — 재렌더가 DOM을 새로 만들면 다음 키 입력이나
  // Next 클릭이 사라진 옛 요소를 향하게 되어 클릭 삼켜짐·포커스 유실이 발생했다.
  input.addEventListener('input', () => {
    const v = parseFloat(input.value);
    if (!Number.isNaN(v)) game.design[key] = Math.min(max, Math.max(min, v));
    updateWizNav(); // Next 버튼 상태만 갱신
  });
  // blur(change): 최종값을 클램프해 input.value에 반영. NaN이면 이전 값으로 복원.
  // 여기서도 재렌더는 하지 않는다(포커스 이동 중 DOM 파괴 방지).
  input.addEventListener('change', () => {
    const v = parseFloat(input.value);
    if (Number.isNaN(v)) { input.value = game.design[key] ?? ''; updateWizNav(); return; } // NaN → 이전 값 복원
    const c = Math.min(max, Math.max(min, v));
    game.design[key] = c;
    input.value = c;
    updateWizNav(); // Next 버튼 상태만 갱신
  });
  return h('div', { class: 'num-field' },
    h('label', {}, label),
    h('div', { class: 'wrap' }, input, h('span', { class: 'unit' }, unit)),
    hint ? h('div', { class: 'hint' }, hint) : null);
}

// ── 재료 물성 카드 (상시 표시) ────────────────────────────────────
// 미션의 굵은골재 형상(aggShape)에 따라 라벨에 형상 문구를 덧붙인다.
const AGG_SHAPE_LABEL = { rounded: 'Well-rounded river gravel', crushed: 'Crushed stone (angular)' };
function materialsCard() {
  const M = E.DATA.MAT;
  const shape = game.mission ? AGG_SHAPE_LABEL[game.mission.aggShape] : null;
  return refTable('Materials Lab Report',
    ['Property', 'Value'],
    [['Cement specific gravity', M.sgCement],
     ['Coarse aggregate', shape ? `${M.sgCA} SG (SSD) — ${shape}` : `${M.sgCA} SG (SSD)`],
     ['Coarse agg. dry-rodded unit weight', M.druwCA + ' lb/cu ft'],
     ['Coarse agg. absorption', (M.absCA * 100).toFixed(1) + '%'],
     ['Fine agg. specific gravity (SSD)', M.sgFA],
     ['Fine agg. fineness modulus', M.fmSand.toFixed(2)],
     ['Fine agg. absorption', (M.absFA * 100).toFixed(1) + '%']],
    'All aggregates assumed at SSD condition.');
}

// ── 스텝 정의 (1–2) ───────────────────────────────────────────────
// 강의 Slide 8 표: Member/placement별 권장 슬럼프 범위 (in.)
const SLUMP_RECOMMEND = [
  ['Footings and slabs', 2, 5],
  ['Beams and reinforced walls', 3, 5],
  ['Building columns', 3, 5],
];
const STEP_DEFS = [
  {
    id: 'slump', title: 'Step 1 — Choose the target slump', sub:
      'Consult the table and pick a slump consistent with your project. The mission spec is the governing requirement.',
    render(box) {
      box.append(numField({ label: 'Design slump', key: 'slumpTarget', unit: 'in.',
        min: 0.5, max: 8, step: 0.25,
        hint: `Mission requires ${game.mission.slumpRange[0]}–${game.mission.slumpRange[1]} in.` }));
    },
    refPanels: () => [refTable('Recommended slumps for various types of construction',
      ['Member / placement', 'Min (in.)', 'Max (in.)'],
      SLUMP_RECOMMEND.map(r => [r[0], r[1], r[2]]),
      'Maximum slump may be increased 1 in. when consolidation is not by vibration.')],
    ready: () => game.design.slumpTarget != null,
  },
  {
    id: 'nmas', title: 'Step 2 — Maximum aggregate size', sub:
      'Choose the largest nominal maximum size available for this project.',
    render(box) {
      box.append(h('div', { class: 'choice-row' },
        game.mission.nmasAllowed.map(n =>
          h('button', {
            class: 'choice' + (game.design.nmas === n ? ' selected' : ''),
            onclick: () => { game.design.nmas = n; renderDesign(); },
          }, fmtNmas(n)))));
    },
    refPanels: () => [refTable('Nominal maximum sizes available at the plant',
      ['Size', 'Note'],
      game.mission.nmasAllowed.map(n => [fmtNmas(n), 'in stock']),
      'Rule of thumb: NMAS ≤ 1/5 of the narrowest form dimension, ≤ 3/4 of clear rebar spacing, ≤ 1/3 of slab depth.')],
    ready: () => game.design.nmas != null,
  },
  {
    id: 'water', title: 'Step 3 — Mixing water and air content', sub:
      'Read the water requirement for your slump and aggregate size. Decide whether this mix needs air entrainment.',
    render(box) {
      const d = game.design;
      const aeBtn = (on, lbl) => h('button', {
        class: 'choice' + (d.isAE === on ? ' selected' : ''),
        onclick: () => { d.isAE = on; renderDesign(); } }, lbl);
      box.append(
        h('div', { class: 'num-field' }, h('label', {}, 'Mix type'),
          h('div', { class: 'choice-row' }, aeBtn(false, 'Non-air-entrained'), aeBtn(true, 'Air-entrained'))),
        numField({ label: 'Mixing water', key: 'water', unit: 'lb/cu yd', min: 100, max: 500, step: 1 }),
        numField({ label: 'Target air content', key: 'airPct', unit: '%', min: 0, max: 10, step: 0.5,
          hint: 'Non-AE mixes still trap some air — see the table.' }));
    },
    refPanels: () => {
      const W = E.DATA.WATER_TABLE, nmasCols = E.DATA.NMAS_LIST;
      const head = ['Slump (in.)', ...nmasCols.map(fmtNmas)];
      const slumpRows = ['1 to 2', '3 to 4', '6 to 7'];
      const body = (kind) => slumpRows.map((lbl, i) => [lbl, ...nmasCols.map(n => W[kind][n][i])]);
      return [
        refTable('Approximate mixing water (lb/cu yd) — non-air-entrained', head,
          [...body('nonAE'), ['Entrapped air (%)', ...nmasCols.map(n => W.entrappedAir[n])]]),
        refTable('Approximate mixing water (lb/cu yd) — air-entrained', head,
          [...body('ae'),
           ['Target air, mild exposure (%)', ...nmasCols.map(n => W.targetAir[n][0])],
           ['Target air, moderate (%)', ...nmasCols.map(n => W.targetAir[n][1])],
           ['Target air, severe (%)', ...nmasCols.map(n => W.targetAir[n][2])]]),
        h('div', { class: 'card' },
          h('strong', {}, 'Aggregate shape correction: '),
          'Angular/crushed: use the table value as-is. Well-rounded gravel: start with an 8% reduction.'),
      ];
    },
    ready: () => game.design.water != null && game.design.airPct != null,
  },
  {
    id: 'wc', title: 'Step 4 — Water-cement ratio', sub:
      "Pick the w/c that delivers the required average strength. Interpolate between rows if needed.",
    render(box) {
      box.append(numField({ label: 'Water-cement ratio', key: 'wc', unit: 'by weight',
        min: 0.25, max: 1.0, step: 0.01,
        hint: "Assume no acceptable strength record. Read the f'cr table first, then pick w/cm." }));
    },
    refPanels: () => {
      const T = E.DATA.WC_TABLE;
      return [
        refTable("Required average strength f'cr (no strength record)",
          ["Specified f'c (psi)", "Required f'cr (psi)"],
          [["f'c < 3,000", "f'c + 1,000"], ["3,000 ≤ f'c ≤ 5,000", "f'c + 1,200"], ["f'c > 5,000", "1.1 × f'c + 700"]]),
        refTable('Relationship between w/c and compressive strength',
          ["28-day f'c (psi)", 'Non-AE', 'Air-entrained'],
          T.strengths.map((fc, i) => [fc.toLocaleString(), T.nonAE[i].toFixed(2), T.ae[i] == null ? '—' : T.ae[i].toFixed(2)]),
          'Strengths are for concrete containing no more air than the table amounts.'),
      ];
    },
    ready: () => game.design.wc != null,
  },
  {
    id: 'cement', title: 'Step 5 — Cement content', sub:
      'Compute the cement content from your water content and w/c ratio, then enter it.',
    render(box) {
      box.append(
        h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;margin-bottom:4px' },
          h('strong', {}, 'Formula: '), 'cement = water ÷ (w/c)'),
        numField({ label: 'Cement content', key: 'cement', unit: 'lb/cu yd', min: 200, max: 1200, step: 1 }));
    },
    refPanels: () => [],
    ready: () => game.design.cement != null,
  },
  {
    id: 'coarse', title: 'Step 6 — Coarse aggregate', sub:
      'Read the dry-rodded bulk volume fraction for your aggregate size and sand fineness modulus, then convert to weight.',
    render(box) {
      box.append(
        h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;margin-bottom:4px' },
          h('div', {}, h('strong', {}, 'Formula: '), 'OD weight = (b/b₀) × 27 cu ft × dry-rodded unit weight'),
          h('div', {}, 'SSD weight = OD × (1 + absorption)')),
        numField({ label: 'Coarse aggregate (SSD basis)', key: 'ca', unit: 'lb/cu yd', min: 0, max: 2500, step: 1 }));
    },
    refPanels: () => {
      const T = E.DATA.CA_VOLUME_TABLE;
      return [refTable('Volume of dry-rodded coarse aggregate per unit volume of concrete',
        ['NMAS', ...T.fm.map(f => 'FM ' + f.toFixed(2))],
        E.DATA.NMAS_LIST.map(n => [fmtNmas(n), ...T[n].map(v => v.toFixed(2))]),
        'Interpolate for fineness modulus values between columns.')];
    },
    ready: () => game.design.ca != null,
  },
  {
    id: 'fine', title: 'Step 7 — Fine aggregate (absolute volume method)', sub:
      'Convert every other ingredient to absolute volume, then find the fine aggregate volume by difference.',
    render(box) {
      box.append(
        h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;margin-bottom:4px' },
          h('div', {}, h('strong', {}, 'Formula: '), 'V (cu yd) = mass ÷ (relative density × 1,685)'),
          h('div', {}, 'V_air = air% ÷ 100'),
          h('div', {}, 'V_fine = 1.000 − ΣV')),
        numField({ label: 'Cementitious volume', key: 'vCm', unit: 'cu yd', min: 0, max: 1, step: 0.001 }),
        numField({ label: 'Water volume', key: 'vWater', unit: 'cu yd', min: 0, max: 1, step: 0.001 }),
        numField({ label: 'Coarse agg. volume', key: 'vCa', unit: 'cu yd', min: 0, max: 1, step: 0.001 }),
        numField({ label: 'Air volume', key: 'vAir', unit: 'cu yd', min: 0, max: 1, step: 0.001 }));
      // 라이브 표시줄: 요소는 여기서 한 번만 만들고, 이후 갱신은 updateWizNav() → updateVFineLine()가 담당한다
      vFineLine = h('div', { class: 'card', style: 'background:var(--primary-50);border-color:transparent;box-shadow:none;font-weight:600' }, 'V_fine = —');
      box.append(vFineLine,
        numField({ label: 'Fine aggregate (SSD basis)', key: 'fa', unit: 'lb/cu yd', min: 0, max: 2500, step: 1 }));
      updateVFineLine(); // 스텝을 다시 방문했을 때 기존 입력값을 즉시 반영
    },
    refPanels: () => [], // 참고표 없음 — materialsCard()의 비중(RD) 값만 사용
    ready: () => game.design.vCm != null && game.design.vWater != null && game.design.vCa != null
      && game.design.vAir != null && game.design.fa != null,
  },
];

// ── DESIGN 장면 ───────────────────────────────────────────────────
let designStep = 0;
let designRoot = null;
function renderDesign() {
  if (!designRoot) return;
  designRoot.innerHTML = '';
  const total = STEP_DEFS.length; // summary는 별도 장면
  const def = STEP_DEFS[designStep];
  // 스텝퍼
  designRoot.append(h('div', { class: 'stepper' },
    STEP_DEFS.map((s, i) => h('div', {
      class: 'step' + (i < designStep ? ' done' : i === designStep ? ' current' : '') },
      h('div', { class: 'dot' }, i < designStep ? '✓' : String(i + 1)),
      h('div', { class: 'lbl' }, s.id.toUpperCase())))));
  // 본문 2컬럼
  const box = h('div', { class: 'card' }, h('h2', {}, def.title), h('p', { class: 'sub' }, def.sub));
  vFineLine = null; // 재렌더 시 이전 스텝(7)의 표시줄 참조를 정리 — 현재 스텝이 'fine'이면 render()가 즉시 새로 채운다
  def.render(box);
  const nextBtn = h('button', {
    class: 'btn btn-primary',
    onclick: () => { designStep + 1 < total ? (designStep++, renderDesign()) : go('summary'); },
  }, designStep + 1 < total ? 'Next →' : 'Review mix →');
  nextBtn.disabled = !def.ready(); // h()의 setAttribute는 undefined도 문자열로 세팅하므로 속성 대신 프로퍼티로 직접 제어
  wizNextBtn = nextBtn; // numField가 재렌더 없이 이 버튼 상태만 갱신할 수 있도록 모듈 변수에 저장
  box.append(h('div', { class: 'wiz-nav' },
    h('button', { class: 'btn', onclick: () => { designStep === 0 ? go('home') : (designStep--, renderDesign()); } },
      '← Back'),
    nextBtn));
  designRoot.append(h('div', { class: 'wizard-grid' }, box,
    h('div', { class: 'ref-panel' }, def.refPanels(), materialsCard())));
}
Scenes.design = () => ({
  mount(root) { designStep = 0; designRoot = root; renderDesign(); },
  unmount() { designRoot = null; wizNextBtn = null; vFineLine = null; },
});

// ── 배합 요약 ─────────────────────────────────────────────────────
Scenes.summary = () => ({
  mount(root) {
    const d = game.design, m = game.mission;
    const rows = [
      ['Water', d.water, 'lb/cu yd'], ['Cement', d.cement, 'lb/cu yd'],
      ['Coarse aggregate', d.ca, 'lb/cu yd'], ['Fine aggregate', d.fa, 'lb/cu yd'],
      ['Design air content', d.airPct, '%'],
      ['Max aggregate size', fmtNmas(d.nmas), ''],
      ['Mix type', d.isAE ? 'Air-entrained' : 'Non-air-entrained', ''],
      ['Design w/c (intent)', d.wc, ''],
      ['Actual w/c (water ÷ cement)', (d.water / d.cement).toFixed(3), ''],
      ['Absolute volume check', (E.computeYield(designToMix()) / 27).toFixed(3), 'cu yd'],
      ['Total batch weight', (d.water + d.cement + d.ca + d.fa).toLocaleString(), 'lb/cu yd'],
    ];
    root.append(
      h('h1', {}, 'Mix summary'),
      h('p', { class: 'sub' }, `${m.icon} ${m.name} — one cubic yard batch. Ready when you are.`),
      h('div', { class: 'wizard-grid' },
        h('div', { class: 'card' },
          h('table', { class: 'ref-table' }, h('tbody', {},
            rows.map(r => h('tr', {}, h('td', {}, r[0]),

// ── 캔버스 공통 ───────────────────────────────────────────────────
function canvasStage(w, hgt) {
  const dpr = window.devicePixelRatio || 1;
  const canvas = h('canvas', { class: 'canvas-stage', width: w * dpr, height: hgt * dpr,
    style: `max-width:${w}px` });
  const ctx = canvas.getContext('2d');
  if (!ctx) return { canvas, ctx: null }; // Canvas 미지원 환경 — 호출부에서 텍스트 폴백으로 전환
  ctx.scale(dpr, dpr);
  return { canvas, ctx };
}
const easeOutCubic = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
function sceneShell(root, title, sub, canvas, actions) {
  root.append(h('h1', {}, title), h('p', { class: 'sub' }, sub), canvas,
    h('div', { class: 'stage-actions' }, actions));
}
// Canvas 미지원 시 공통 텍스트 폴백: 애니메이션 대신 카드로 수치 결과를 보여주고
// 다음 장면 버튼을 즉시 활성화한다 (스펙 §6 "Canvas 미지원 시 텍스트 결과 폴백").
function canvasFallback(root, title, sub, resultNodes, nextLabel, onNext) {
  root.append(h('h1', {}, title), h('p', { class: 'sub' }, sub),
    h('div', { class: 'card' }, resultNodes),
    h('div', { class: 'stage-actions' },
      h('button', { class: 'btn btn-primary', onclick: onNext }, nextLabel)));
}

// ── MIX: 드럼 믹서 ────────────────────────────────────────────────
Scenes.mix = () => {
  let raf = 0, start = 0;
  const W = 900, H = 420;
  const mix = designToMix();
  const wc = mix.cement > 0 ? mix.water / mix.cement : 1.2;
  return {
    mount(root) {
      const { canvas, ctx } = canvasStage(W, H);
      if (!ctx) {
        canvasFallback(root, 'Batching & mixing', 'One cubic yard, coming up.',
          h('p', {}, 'Mixing complete.'), 'Continue to Slump Test →', () => go('slump'));
        return;
      }
      const nextBtn = h('button', { class: 'btn btn-primary', onclick: () => go('slump') },
        'Continue to Slump Test →');
      nextBtn.disabled = true;
      sceneShell(root, 'Batching & mixing', 'One cubic yard, coming up.', canvas,
        [h('button', { class: 'btn btn-ghost', onclick: () => go('slump') }, 'Skip'), nextBtn]);
      const draw = (now) => {
        if (!start) start = now;
        const t = (now - start) / 1000;
        ctx.clearRect(0, 0, W, H);
        const cx = W / 2, cy = H / 2 + 30;
        ctx.save(); ctx.translate(cx, cy);
        // 드럼 몸통
        ctx.fillStyle = '#c8cdd6'; ctx.strokeStyle = '#9aa2b1'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(0, 0, 160, 115, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // 내부 클리핑
        ctx.save();
        ctx.beginPath(); ctx.ellipse(0, 0, 152, 108, 0, 0, Math.PI * 2); ctx.clip();
        // 콘크리트 차오름 — w/c에 따라 명도/광택
        const fill = Math.min(1, t / 2.6);
        const light = 58 - Math.min(18, Math.max(0, (wc - 0.4) * 40)); // 젖을수록 어둡게
        ctx.fillStyle = `hsl(220 6% ${light}%)`;
        ctx.fillRect(-152, 108 - 190 * fill, 304, 190 * fill);
        // 골재 점 (시드 고정)
        const rng = E.mulberry32(7);
        for (let i = 0; i < 80; i++) {
          const x = (rng() * 2 - 1) * 140, y = 108 - rng() * 180 * fill;
          if (y < 106) {
            ctx.fillStyle = i % 3 ? '#7b7f88' : '#a9adb5';
            ctx.beginPath(); ctx.arc(x, y, 2 + rng() * 4, 0, 7); ctx.fill();
          }
        }
        if (wc > 0.62) { // 과수 배합 광택
          ctx.fillStyle = 'rgba(160,200,255,.25)';
          ctx.beginPath(); ctx.ellipse(0, 55, 120, 24, 0, 0, Math.PI * 2); ctx.fill();
        }
        // 회전 블레이드
        ctx.rotate(t * 1.6);
        for (let i = 0; i < 3; i++) {
          ctx.rotate((Math.PI * 2) / 3);
          ctx.fillStyle = 'rgba(120,128,142,.45)'; ctx.fillRect(-8, -104, 16, 92);
        }
        ctx.restore(); ctx.restore();
        // 투입 스트림: 시멘트 → 물 → 골재
        if (t < 2.4) {
          ctx.fillStyle = t < 0.9 ? '#8f949c' : t < 1.6 ? '#4f8ef0' : '#b7a98d';
          ctx.fillRect(cx - 6, 44, 12, cy - 115 - 44);
        }
        // 캡션
        ctx.fillStyle = '#5b6472'; ctx.font = '600 14px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(t < 0.9 ? 'Adding cement…' : t < 1.6 ? 'Adding water…' :
          t < 2.6 ? 'Adding aggregates…' : 'Mixing…', cx, 32);
        if (t >= 4 && nextBtn.disabled) nextBtn.disabled = false;
        raf = requestAnimationFrame(draw);
      };
      raf = requestAnimationFrame(draw);
    },
    unmount() { cancelAnimationFrame(raf); },
  };
};

// ── SLUMP: 슬럼프 시험 (ASTM C143) ────────────────────────────────
const SLUMP_MODE_BADGE = { zero: ['badge-amber', 'Zero slump — too dry'],
  true: ['badge-green', 'True slump'],
  shear: ['badge-amber', 'Shear slump — harsh mix'],
  collapse: ['badge-red', 'Collapse — too wet'] };
Scenes.slump = () => {
  let raf = 0, start = 0;
  const W = 900, H = 470, PX = 15; // 1 in. = 15 px
  const groundY = H - 60, baseX = W / 2 - 120, invX = baseX + 300; // 시료 중심 / 뒤집은 콘 중심(측정용)
  const TOP_R = 2, BOT_R = 4, HGT = 12; // ASTM 콘 규격: 상단 4"⌀ / 하단 8"⌀ / 높이 12" (반경 2"/4")
  const ROD_TARGET = 25, LAYERS = 3;
  const POUR_T = 0.3, ROD_T = 1.3, PAUSE_T = 0.2, LAYER_T = POUR_T + ROD_T + PAUSE_T; // 층당 채움+다짐+정지
  const FILL_DUR = LAYERS * LAYER_T;   // 3층 채움
  const LIFT_DUR = 5.0;                // ASTM C143 §8.2 규정: 5±2 s 인발을 실제로 시연
  const SETTLE_DUR = 1.2;              // 변형 애니메이션 길이
  const r = game.result; // { behavior:{mode,slump,segregation}, measuredSlump } — 불변 계약: 엔진 재계산 금지, 그대로 소비만 한다
  return {
    mount(root) {
      const { canvas, ctx } = canvasStage(W, H);
      const modeBadge = SLUMP_MODE_BADGE[r.behavior.mode];
      if (!ctx) {
        canvasFallback(root, 'Slump test (ASTM C143)',
          'Fill in three lifts, rod each 25 times, lift the cone — and watch.',
          h('div', {},
            h('p', {}, `Slump: ${r.measuredSlump.toFixed(2)} in.`),
            h('span', { class: 'badge ' + modeBadge[0] }, modeBadge[1])),
          'Proceed to Strength Test →', () => go('compression'));
        return;
      }
      const info = h('div', { class: 'stage-actions', style: 'min-height:34px' });
      const nextBtn = h('button', { class: 'btn btn-primary', onclick: () => go('compression') },
        'Proceed to Strength Test →');
      nextBtn.style.display = 'none';
      sceneShell(root, 'Slump test (ASTM C143)',
        'Fill in three lifts, rod each 25 times, lift the cone — and watch.', canvas, [nextBtn]);
      root.insertBefore(info, root.querySelector('.stage-actions'));

      // ── 재질 그라데이션(요소2·3): 스펙이 "수직" 그라데이션을 명시하므로 세로 방향으로만
      // 두고, 광원 방향(요소8, 상부 좌측)은 별도의 하이라이트 밴드·그림자로 표현한다.
      const steelGrad = (y0, y1) => { const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, '#eef1f6'); g.addColorStop(0.45, '#c3cad6'); g.addColorStop(1, '#8b93a3'); return g; };
      const concreteGrad = (y0, y1) => { const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, '#a89d8c'); g.addColorStop(0.5, '#8a8172'); g.addColorStop(1, '#655f53'); return g; };

      // 접지 그림자 타원(요소8) — 상부 좌측 광원 가정이므로 그림자는 하부 우측으로 살짝 치우친다
      function groundShadow(cx, rx) {
        ctx.save(); ctx.fillStyle = 'rgba(30,34,44,.18)';
        ctx.beginPath(); ctx.ellipse(cx + 6, groundY + 5, rx, Math.max(4, rx * 0.2), 0, 0, Math.PI * 2);
        ctx.fill(); ctx.restore();
      }
      // 강철 베이스 플레이트(요소1): 콘보다 넓은 판 + 클램프 2 + 발판 2
      function drawBasePlate() {
        const px0 = baseX - 190, px1 = invX + 90, ph = 16;
        ctx.fillStyle = steelGrad(groundY, groundY + ph);
        ctx.fillRect(px0, groundY, px1 - px0, ph);
        ctx.strokeStyle = '#6b7484'; ctx.lineWidth = 1.5; ctx.strokeRect(px0, groundY, px1 - px0, ph);
        for (const dx of [-(BOT_R * PX + 8), BOT_R * PX + 8]) { // 클램프 2개 — 콘 밑동 고정 걸쇠
          ctx.fillStyle = '#5b6472'; ctx.fillRect(baseX + dx - 5, groundY - 7, 10, 15);
          ctx.beginPath(); ctx.arc(baseX + dx, groundY - 7, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#3d414a'; ctx.fill();
        }
        ctx.fillStyle = '#9aa2b1'; // 발판 2개 — 오퍼레이터가 밟아 판을 고정하는 자리
        ctx.fillRect(px0 + 16, groundY + 3, 36, 10);
        ctx.fillRect(px1 - 52, groundY + 3, 36, 10);
      }
      // 사다리꼴(프러스텀) 경로 — yBase에 반경 rBaseIn(하단), yBase-hgt에 반경 rTopIn(상단)
      function frustumPath(cx, yBase, rBaseIn, rTopIn, hgtIn) {
        const rB = rBaseIn * PX, rT = rTopIn * PX, hh = hgtIn * PX, p = new Path2D();
        p.moveTo(cx - rB, yBase); p.lineTo(cx - rT, yBase - hh);
        p.lineTo(cx + rT, yBase - hh); p.lineTo(cx + rB, yBase); p.closePath();
        return p;
      }
      // 금속 콘/뒤집은 콘 공용 렌더러(요소2): 광택 수직 그라데이션 + 상하 림(두께) + 손잡이2 + 발판2
      function drawConeShape(cx, yBase, rBaseIn, rTopIn, hgtIn, opts = {}) {
        const rB = rBaseIn * PX, rT = rTopIn * PX, hh = hgtIn * PX, yTop = yBase - hh;
        const path = frustumPath(cx, yBase, rBaseIn, rTopIn, hgtIn);
        ctx.save(); ctx.globalAlpha = opts.alpha ?? 1;
        ctx.fillStyle = steelGrad(yTop, yBase); ctx.fill(path);
        ctx.restore();
        ctx.strokeStyle = '#5b6472'; ctx.lineWidth = 2.5; ctx.stroke(path);
        if ((opts.alpha ?? 1) > 0.7) { // 좌측 하이라이트 밴드 — 상부 좌측 광원(요소8)
          ctx.save(); ctx.clip(path);
          const hl = ctx.createLinearGradient(cx - rB, 0, cx - rB * 0.1, 0);
          hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = hl; ctx.fillRect(cx - rB, yTop, rB * 0.9, hh);
          ctx.restore();
        }
        ctx.fillStyle = '#7d8797'; ctx.strokeStyle = '#5b6472'; ctx.lineWidth = 1.5; // 상·하 림(두께 표현)
        ctx.beginPath(); ctx.ellipse(cx, yTop, rT, 3.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx, yBase, rB, 3.6, 0, 0, Math.PI * 2); ctx.stroke();
        if (opts.handles !== false) { // 손잡이 2개
          const hy = yTop + hh * 0.32;
          ctx.strokeStyle = '#7d8797'; ctx.lineWidth = 3.5;
          ctx.strokeRect(cx - rB - 15, hy - 3, 15, 7); ctx.strokeRect(cx + rB, hy - 3, 15, 7);
        }
        if (opts.feet !== false) { // 발판 2개 — 콘 하단 측면 브래킷
          ctx.fillStyle = '#6b7484';
          ctx.fillRect(cx - rB - 10, yBase - 14, 10, 6); ctx.fillRect(cx + rB, yBase - 14, 10, 6);
        }
      }
      // 다짐봉(steel rod) — 왕복 다짐 스프라이트 + 측정용 수평 거치 겸용.
      // 진행 방향에 수직으로(단면 방향) 그라데이션을 둬 원기둥 하이라이트를 표현하고,
      // 시작점=끝점(길이 0)이 되는 수평/수직 축 모두에서 그라데이션이 소실되지 않게 한다.
      function drawRod(x0, y0, x1, y1, thickness) {
        const vertical = x0 === x1;
        const g = vertical
          ? ctx.createLinearGradient(x0 - thickness / 2, y0, x0 + thickness / 2, y0)
          : ctx.createLinearGradient(x0, y0 - thickness / 2, x0, y0 + thickness / 2);
        g.addColorStop(0, '#eef1f6'); g.addColorStop(0.5, '#aab2c0'); g.addColorStop(1, '#7d8797');
        ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = g; ctx.lineWidth = thickness;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.restore();
      }
      // 굵은골재(불규칙 다각형, 갈색·회색 2톤, 시드 고정) + 잔골재 노이즈(요소3)
      // — 호출부가 미리 clip을 걸어둔 실루엣 내부에서만 그린다.
      function drawAggregate(rng, xCenter, yTop, yBot, xRadius, opts = {}) {
        const count = opts.count ?? 11, edgeBias = opts.edgeBias ?? 1;
        for (let i = 0; i < count; i++) {
          let u = rng() * 2 - 1; const sign = u < 0 ? -1 : 1; u = sign * Math.pow(Math.abs(u), edgeBias);
          const cx2 = xCenter + u * xRadius * 0.86, cy2 = yTop + rng() * Math.max(1, yBot - yTop);
          const rad = 3 + rng() * 4.5, sides = 5 + Math.floor(rng() * 4);
          ctx.beginPath();
          for (let k = 0; k < sides; k++) {
            const ang = (k / sides) * Math.PI * 2 + rng() * 0.4, rr = rad * (0.7 + rng() * 0.5);
            const px = cx2 + Math.cos(ang) * rr, py = cy2 + Math.sin(ang) * rr * 0.85;
            k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = i % 2 ? 'rgba(122,90,61,.78)' : 'rgba(120,124,131,.78)'; // 갈색/회색 2톤
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(214,203,182,.55)'; // 잔골재(모래) 노이즈
        for (let i = 0; i < 55; i++) {
          const x = xCenter + (rng() * 2 - 1) * xRadius * 0.92, y = yTop + rng() * Math.max(1, yBot - yTop);
          ctx.beginPath(); ctx.arc(x, y, 0.6 + rng() * 0.8, 0, Math.PI * 2); ctx.fill();
        }
      }
      // 상부 광택 하이라이트(요소3·8) — 중심에서 좌측으로 살짝 치우쳐 상부-좌측 광원을 암시
      function topGloss(cx, topY, rx) {
        ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.3)';
        ctx.beginPath(); ctx.ellipse(cx - rx * 0.28, topY + 2, Math.max(4, rx * 0.55), 3.2, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.restore();
      }
      // 거친 윤곽 경로 — zero-slump 전용(요소7): 변마다 톱니형 섭동을 줘 "거칠고 뻑뻑한" 표면을 표현
      function roughFrustumPath(cx, yBase, rBaseIn, rTopIn, hgtIn, seed, jitter) {
        const rng = E.mulberry32(seed), rB = rBaseIn * PX, rT = rTopIn * PX, hh = hgtIn * PX, N = 5;
        const pts = [];
        for (let i = 0; i <= N; i++) { const f = i / N; pts.push([cx - (rB + (rT - rB) * f), yBase - hh * f]); }
        pts.push([cx + rT, yBase - hh]);
        for (let i = 0; i <= N; i++) { const f = i / N; pts.push([cx + (rT + (rB - rT) * f), yBase - hh * (1 - f)]); }
        const path = new Path2D();
        pts.forEach(([x, y], i) => { const jx = x + (rng() - 0.5) * jitter, jy = y + (rng() - 0.5) * jitter;
          i === 0 ? path.moveTo(jx, jy) : path.lineTo(jx, jy); });
        path.closePath();
        return path;
      }
      // 완만한 돔 경로 — true slump(요소7)
      function domePath(hgtIn, rBIn, rTIn, capIn) {
        const rB = rBIn * PX, rT = rTIn * PX, hh = hgtIn * PX, cap = capIn * PX, path = new Path2D();
        path.moveTo(baseX - rB, groundY);
        path.quadraticCurveTo(baseX - rB * 0.94, groundY - hh * 0.94, baseX - rT, groundY - hh);
        path.quadraticCurveTo(baseX, groundY - hh - cap, baseX + rT, groundY - hh);
        path.quadraticCurveTo(baseX + rB * 0.94, groundY - hh * 0.94, baseX + rB, groundY);
        path.closePath();
        return path;
      }
      // 퍼진 웅덩이 경로(불규칙 가장자리, 시드 고정) — collapse(요소7)
      function collapsePath(rBIn, hgtIn) {
        const rng = E.mulberry32(11), rB = rBIn * PX, hh = hgtIn * PX, path = new Path2D();
        path.moveTo(baseX - rB, groundY);
        path.quadraticCurveTo(baseX - rB * 0.7, groundY - hh * (1 + rng() * 0.3), baseX - rB * 0.25, groundY - hh);
        path.quadraticCurveTo(baseX, groundY - hh * (1.15 + rng() * 0.2), baseX + rB * 0.3, groundY - hh * 0.95);
        path.quadraticCurveTo(baseX + rB * 0.75, groundY - hh * (0.8 + rng() * 0.3), baseX + rB, groundY);
        path.closePath();
        return path;
      }
      // 블리딩 수막(밝은 반사 띠) — collapse 전용(요소7)
      function drawBleedFilm(cx, rx) {
        ctx.save();
        const g = ctx.createRadialGradient(cx - 12, groundY - 4, rx * 0.1, cx, groundY, rx * 1.05);
        g.addColorStop(0, 'rgba(255,255,255,.08)'); g.addColorStop(0.7, 'rgba(190,220,245,.35)');
        g.addColorStop(1, 'rgba(190,220,245,0)');

        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; // 표면에 뜨는 밝은 반사 띠
        ctx.beginPath(); ctx.ellipse(cx - rx * 0.15, groundY - 1, rx * 0.7, rx * 0.09, 0, Math.PI * 1.05, Math.PI * 1.75);
        ctx.stroke(); ctx.restore();
      }
      // 콘크리트 프로파일(요소3·7) — p: 변형 진행도 0→1. 형상 산정은 behavior.slump(연속값)를 쓰고,
      // 최종 라벨·치수선만 measuredSlump(양자화값)를 쓴다 — v1 관례 그대로 유지(엔진 재계산 아님).
      function drawConcrete(p) {
        const s = r.behavior.slump, mode = r.behavior.mode;
        let path, xRadius, yTop, yBot, edgeBias = 1, glossRx = TOP_R * PX;
        if (mode === 'zero') {
          const hgt = HGT - 0.3 * p; // 거의 원형 유지, 거친 윤곽만 부여
          path = roughFrustumPath(baseX, groundY, BOT_R, TOP_R, hgt, 51, 3.2);
          xRadius = BOT_R * PX; yTop = groundY - hgt * PX; yBot = groundY;
        } else if (mode === 'true') {
          const hgt = HGT - s * p, rB = BOT_R + s * 0.45 * p, rT = TOP_R + s * 0.35 * p, cap = 0.35 + s * 0.4 * p;
          path = domePath(hgt, rB, rT, cap);
          xRadius = rB * PX; yTop = groundY - (hgt + cap) * PX; yBot = groundY; glossRx = rT * PX;
        } else if (mode === 'shear') {
          const hgt = HGT - s * 0.6 * p, bodyDx = -0.8 * PX * p;
          path = new Path2D();
          path.moveTo(baseX + bodyDx - 3.4 * PX, groundY); path.lineTo(baseX + bodyDx - 1.8 * PX, groundY - hgt * PX);
          path.lineTo(baseX + bodyDx + 1.8 * PX, groundY - hgt * PX); path.lineTo(baseX + bodyDx + 3.4 * PX, groundY);
          path.closePath(); // 남은 몸통
          const wx = baseX + (2.5 + s * 0.5) * PX * p, ang = 0.5 * p; // 전단면으로 미끄러진 반쪽 웨지
          const wedge = [[-2.2 * PX, 0], [-0.6 * PX, -(hgt * 0.55) * PX / 1.4],
            [1.8 * PX, -(hgt * 0.3) * PX / 1.4], [2.6 * PX, 0]];
          wedge.forEach(([dx, dy], i) => {
            const rx = dx * Math.cos(ang) - dy * Math.sin(ang), ry = dx * Math.sin(ang) + dy * Math.cos(ang);
            i === 0 ? path.moveTo(wx + rx, groundY + ry) : path.lineTo(wx + rx, groundY + ry);
          });
          path.closePath();
          xRadius = 4 * PX; yTop = groundY - hgt * PX; yBot = groundY;
        } else { // collapse: 팬케이크 + 가장자리 골재 몰림 + 블리딩 수막
          const hgt = 1.6 + (HGT - 1.6) * (1 - p), rB = BOT_R + 13 * p;
          drawBleedFilm(baseX, (rB + 2.5) * PX); // 수막을 먼저 그려 테두리 밖으로 살짝 비치게 함
          path = collapsePath(rB, hgt);
          xRadius = rB * PX; yTop = groundY - hgt * PX * 1.15; yBot = groundY;
          edgeBias = 0.42; glossRx = rB * PX * 0.4; // <1 → 골재가 가장자리로 쏠려 분포
        }
        ctx.fillStyle = concreteGrad(yTop, yBot); ctx.fill(path);
        ctx.strokeStyle = '#5c5548'; ctx.lineWidth = 1.5; ctx.stroke(path);
        ctx.save(); ctx.clip(path);
        drawAggregate(E.mulberry32(23), baseX, yTop, yBot, xRadius,
          { edgeBias, count: mode === 'collapse' ? 16 : 11 });
        ctx.restore();
        topGloss(baseX, yTop, glossRx);
        groundShadow(baseX, xRadius + 8);
      }
      // 측정 단계(요소6): 뒤집은 콘을 시료 옆에 세운다
      function drawInvertedMold() {
        drawConeShape(invX, groundY, TOP_R, BOT_R, HGT, { handles: false });
        groundShadow(invX, TOP_R * PX + 10);
      }
      // 측정 오버레이(요소6): 다짐봉을 뒤집은 콘 위에 수평으로 얹고, 봉 아래에서 변위된 원중심까지
      // 수직 치수선을 긋는다. v1의 빨간 점선·화살표는 폐기하고 중립색 실선+눈금으로 대체했다.
      function drawMeasure() {
        const ropeY = groundY - HGT * PX; // 뒤집은 콘(=원래 콘) 높이 기준선 — 봉이 얹히는 높이
        const topY = groundY - (HGT - r.measuredSlump) * PX; // 변위된 원중심 높이
        drawRod(baseX, ropeY, invX + 50, ropeY, 7); // 다짐봉을 수평으로 거치
        ctx.strokeStyle = '#2b3040'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(baseX, ropeY); ctx.lineTo(baseX, topY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(baseX - 7, ropeY); ctx.lineTo(baseX + 7, ropeY); ctx.stroke(); // 상단 눈금
        ctx.beginPath(); ctx.moveTo(baseX - 7, topY); ctx.lineTo(baseX + 7, topY); ctx.stroke();   // 하단 눈금
        ctx.fillStyle = '#2b3040'; ctx.font = '700 16px Inter, sans-serif'; ctx.textAlign = 'left';
        // 슬럼프가 거의 0이면 눈금 사이 간격이 라벨과 겹치므로 라벨을 기준선 위로 띄운다(v1 fix 동등 유지)
        const tiny = r.measuredSlump < 0.75;
        const labelY = tiny ? ropeY - 14 : (ropeY + topY) / 2;
        ctx.fillText(`Slump: ${r.measuredSlump.toFixed(2)} in.`, baseX + 16, labelY);
      }

      const draw = (now) => {
        if (!start) start = now;
        const t = (now - start) / 1000;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#d7dde6'; ctx.fillRect(0, groundY, W, H - groundY); // 지면
        ctx.fillStyle = '#5b6472'; ctx.font = '600 13px Inter, sans-serif'; ctx.textAlign = 'center';

        if (t < FILL_DUR) { // 채움: 3층 + 다짐봉 왕복 + 카운터(요소4)
          drawBasePlate();
          const layerIdx = Math.min(LAYERS - 1, Math.floor(t / LAYER_T));
          const tl = t - layerIdx * LAYER_T, layerH = HGT / LAYERS;
          const pourFrac = Math.min(1, tl / POUR_T);
          const rodProg = tl <= POUR_T ? 0 : Math.min(1, (tl - POUR_T) / ROD_T);
          const filledH = layerIdx * layerH + pourFrac * layerH;
          const conePath = frustumPath(baseX, groundY, BOT_R, TOP_R, HGT);
          ctx.save(); ctx.clip(conePath); // 콘 안쪽 사다리꼴 단면으로 채움
          ctx.fillStyle = concreteGrad(groundY - filledH * PX, groundY);
          ctx.fillRect(baseX - BOT_R * PX, groundY - filledH * PX, BOT_R * 2 * PX, filledH * PX);
          if (filledH > 0.3) drawAggregate(E.mulberry32(23), baseX, groundY - filledH * PX, groundY, BOT_R * PX, { count: 8 });
          ctx.restore();
          drawConeShape(baseX, groundY, BOT_R, TOP_R, HGT, { alpha: 0.5 }); // 반투명 컷어웨이로 채움 과정을 보여준다
          groundShadow(baseX, BOT_R * PX + 10);
          if (rodProg > 0) {
            const rodPos = rodProg * ROD_TARGET, rodCount = Math.min(ROD_TARGET, Math.floor(rodPos));
            const poke = Math.sin(Math.min(1, rodPos - rodCount) * Math.PI); // 찔렀다 빼는 왕복 모션
            const rodX = baseX + Math.sin(rodCount * 2.3) * (BOT_R * PX * 0.5);
            const rodTopY = groundY - HGT * PX - 18, rodTipY = groundY - filledH * PX + 8 - poke * 12;
            drawRod(rodX, rodTopY, rodX, rodTipY, 5);
            ctx.fillText(`Lift ${layerIdx + 1} of 3 — Rodding… ${rodCount} / 25`, W / 2, 36);
          } else {
            ctx.fillText(`Lift ${layerIdx + 1} of 3 — placing concrete…`, W / 2, 36);
          }
        } else if (t < FILL_DUR + LIFT_DUR) { // 인발: 콘 상승 + 타이머(요소5)
          const lt = t - FILL_DUR;
          drawBasePlate();
          drawConcrete(0); // 아직 변형 전 — 원통 그대로 유지
          const lift = easeOutCubic(lt / LIFT_DUR) * (HGT + 4) * PX;
          drawConeShape(baseX, groundY - lift, BOT_R, TOP_R, HGT);
          ctx.fillText(`Lifting: ${lt.toFixed(1)} s`, W / 2, 36);
          ctx.font = '500 12px Inter, sans-serif'; ctx.fillStyle = '#8b93a3';
          ctx.fillText('ASTM C143 §8.2 — raise the mold in 5 ± 2 s, straight up, no lateral or torsional motion', W / 2, 54);
        } else { // 변형 + 측정(요소6·7)
          const p = easeOutCubic(Math.min(1, (t - FILL_DUR - LIFT_DUR) / SETTLE_DUR));
          drawBasePlate();
          drawConcrete(p);
          ctx.fillText(p >= 1 ? 'Measuring the slump…' : 'Concrete settling…', W / 2, 36);
          if (p >= 1) {
            drawInvertedMold();
            drawMeasure();
            if (nextBtn.style.display === 'none') {
              nextBtn.style.display = '';
              info.append(h('span', { class: 'badge ' + modeBadge[0] }, modeBadge[1]));
            }
          }
        }
        raf = requestAnimationFrame(draw);
      };
      raf = requestAnimationFrame(draw);
    },
    unmount() { cancelAnimationFrame(raf); },
  };
};

// ── COMPRESSION: 압축강도 시험 ────────────────────────────────────
Scenes.compression = () => {
  let raf = 0, start = 0;
  const W = 900, H = 470;
  const r = game.result;
  const AREA = 28.27; // 6" 지름 공시체 단면적 (in²)
  function stressAt(fp, eps) {
    const e0 = 0.002, x = eps / e0;
    if (x <= 1) return fp * (2 * x - x * x);
    return Math.max(0, fp * (1 - 0.35 * (eps - e0) / 0.0018));
  }
  return {
    mount(root) {
      const { canvas, ctx } = canvasStage(W, H);
      if (!ctx) {
        canvasFallback(root, 'Compression test (ASTM C39)',
          'Three 6×12 cylinders, 28 days moist-cured, loaded to failure.',
          h('div', {},
            r.cylinders.map((s, i) => h('p', {}, `#${i + 1}: ${Math.round(s).toLocaleString()} psi`)),
            h('p', { style: 'font-weight:700' }, `Average: ${Math.round(r.avgStrength).toLocaleString()} psi`)),
          'See Final Report →', () => go('results'));
        return;
      }
      const nextBtn = h('button', { class: 'btn btn-primary', onclick: () => go('results') },
        'See Final Report →');
      nextBtn.style.display = 'none';
      sceneShell(root, 'Compression test (ASTM C39)',
        'Three 6×12 cylinders, 28 days moist-cured, loaded to failure.', canvas, [nextBtn]);

      const CYL_T = 2.6; // 공시체당 재하 시간(초)
      const testStart = 3.5;
      const done = [];   // 파괴 완료된 공시체 강도

      function drawUTM(cx, fp, prog, mode) {
        // prog: 0→1 재하 진행. eps = prog * 0.0038
        const eps = prog * 0.0038;
        // 큰 판독기(psi/lbf)는 피크(0.002) 이후에도 값이 되돌아 내려가지 않도록 고정 표시한다.
        // 그래프 곡선은 실제 eps로 그려 하강부(연화)를 그대로 보여준다.
        const displaySigma = stressAt(fp, Math.min(eps, 0.002));
        const peaked = eps > 0.002;
        const cw = 3 * 16, ch = 12 * 10; // 공시체 48×120 px
        const top = 130, squash = Math.min(10, prog * 12);
        // 프레임
        ctx.fillStyle = '#aab2c0';
        ctx.fillRect(cx - 70, 60, 140, 26);               // 상부 크로스헤드
        ctx.fillRect(cx - 70, top + ch + 14, 140, 26);    // 하부 베드
        ctx.fillRect(cx - 66, 60, 14, ch + 80); ctx.fillRect(cx + 52, 60, 14, ch + 80); // 기둥
        // 플래튼
        ctx.fillStyle = '#7d8797';
        ctx.fillRect(cx - 40, top - 12 + squash, 80, 10);
        ctx.fillRect(cx - 40, top + ch + 2, 80, 10);
        // 공시체
        ctx.fillStyle = '#8d9199'; ctx.strokeStyle = '#6a6e76'; ctx.lineWidth = 1.5;
        ctx.fillRect(cx - cw / 2, top + squash, cw, ch - squash);
        ctx.strokeRect(cx - cw / 2, top + squash, cw, ch - squash);
        // 균열 (피크 이후)
        if (peaked) {
          ctx.strokeStyle = '#3d414a'; ctx.lineWidth = 2;
          const cp = Math.min(1, (eps - 0.002) / 0.0016);
          ctx.save(); ctx.beginPath(); ctx.rect(cx - cw / 2, top + squash, cw, ch - squash); ctx.clip();
          if (mode === 'columnar') {          // 수직 쪼개짐 (고강도)
            for (const dx of [-14, 0, 15]) {
              ctx.beginPath(); ctx.moveTo(cx + dx, top + squash);
              ctx.lineTo(cx + dx + 4, top + squash + (ch - squash) * cp); ctx.stroke();
            }
          } else if (mode === 'crumble') {    // 부스러짐 (재료분리)
            const rng = E.mulberry32(31);
            for (let i = 0; i < 8; i++) {
              const x0 = cx - cw / 2 + rng() * cw, y0 = top + squash + rng() * (ch - squash);
              ctx.beginPath(); ctx.moveTo(x0, y0);
              ctx.lineTo(x0 + (rng() - 0.5) * 30 * cp, y0 + rng() * 26 * cp); ctx.stroke();
            }
          } else {                            // 원추형 (표준)
            ctx.beginPath(); ctx.moveTo(cx - cw / 2, top + squash + 8);
            ctx.lineTo(cx, top + (ch + squash) / 2 + 20);
            ctx.lineTo(cx + cw / 2, top + squash + 8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx - cw / 2, top + ch - 8);
            ctx.lineTo(cx, top + (ch + squash) / 2 - 10);
            ctx.lineTo(cx + cw / 2, top + ch - 8); ctx.stroke();
          }
          ctx.restore();
        }
        // 판독기 (피크 고정값 표시)
        ctx.fillStyle = '#141c2b'; ctx.font = '700 22px Inter, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(`${Math.round(displaySigma).toLocaleString()} psi`, cx + 110, 150);
        ctx.font = '500 13px Inter, sans-serif'; ctx.fillStyle = '#5b6472';
        ctx.fillText(`${Math.round(displaySigma * AREA).toLocaleString()} lbf`, cx + 110, 172);
        return { eps };
      }
      function drawGraph(fp, epsNow) {
        // 우측 응력-변형률 미니 그래프
        const gx = 610, gy = 110, gw = 250, gh = 220;
        ctx.strokeStyle = '#c9cfda'; ctx.lineWidth = 1.5;
        ctx.strokeRect(gx, gy, gw, gh);
        ctx.fillStyle = '#98a1b0'; ctx.font = '500 11px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('strain', gx + gw / 2, gy + gh + 16);
        ctx.save(); ctx.translate(gx - 8, gy + gh / 2); ctx.rotate(-Math.PI / 2);
        ctx.fillText('stress (psi)', 0, 0); ctx.restore();
        ctx.strokeStyle = '#1b66f0'; ctx.lineWidth = 2.5; ctx.beginPath();
        const yMax = r.f28 * 1.15 || 1000;
        for (let e = 0; e <= epsNow; e += 0.00004) {
          const px2 = gx + (e / 0.0038) * gw;
          const py = gy + gh - (stressAt(fp, e) / yMax) * gh;
          e === 0 ? ctx.moveTo(px2, py) : ctx.lineTo(px2, py);
        }
        ctx.stroke();
      }
      const failMode = r.behavior.segregation ? 'crumble' : (r.f28 >= 5000 ? 'columnar' : 'cone');

      const draw = (now) => {
        if (!start) start = now;
        const t = (now - start) / 1000;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#5b6472'; ctx.font = '600 13px Inter, sans-serif'; ctx.textAlign = 'center';
        if (t < 1.5) { // cast
          ctx.fillText('Casting cylinders…', W / 2, 36);
          for (let i = 0; i < 3; i++) {
            const cx = W / 2 - 140 + i * 140, fillH = Math.min(1, t / 1.2 - i * 0.15) * 110;
            ctx.strokeStyle = '#7d8797'; ctx.lineWidth = 2; ctx.strokeRect(cx - 24, 200, 48, 120);
            if (fillH > 0) { ctx.fillStyle = '#83878f'; ctx.fillRect(cx - 22, 320 - Math.max(0, fillH), 44, Math.max(0, fillH)); }
          }
        } else if (t < testStart) { // cure
          const day = Math.min(28, Math.max(1, Math.round(((t - 1.5) / 2) * 28)));
          ctx.fillText('Moist curing…', W / 2, 36);
          ctx.font = '800 46px Inter, sans-serif'; ctx.fillStyle = '#141c2b';
          ctx.fillText(`Day ${day}`, W / 2, H / 2 - 10);
          ctx.font = '500 14px Inter, sans-serif'; ctx.fillStyle = '#5b6472';
          ctx.fillText('73 °F · 100% RH', W / 2, H / 2 + 18);
        } else { // 3본 순차 재하
          const idx = Math.min(2, Math.floor((t - testStart) / CYL_T));
          const prog = Math.min(1, ((t - testStart) - idx * CYL_T) / (CYL_T * 0.92));
          ctx.fillText(`Cylinder ${idx + 1} of 3`, W / 2, 36);
          const { eps } = drawUTM(280, r.cylinders[idx], prog, failMode);
          drawGraph(r.cylinders[idx], eps);
          // idx보다 낮은 회차는 시간상 재하가 이미 끝났음이 확정되므로(idx는 증가만 함),
          // 프레임 점프(백그라운드 탭 스로틀·GC 히치 등)로 등식이 어긋나도 소프트락 없이 캐치업
          while (done.length < idx && done.length < 3) done.push(r.cylinders[done.length]);
          if (prog >= 1 && done.length === idx && done.length < 3) done.push(r.cylinders[idx]);
          // 완료 목록
          ctx.textAlign = 'left'; ctx.font = '600 14px Inter, sans-serif';
          done.forEach((s, i) => {
            ctx.fillStyle = '#12855f';
            ctx.fillText(`#${i + 1}: ${Math.round(s).toLocaleString()} psi`, 610, 370 + i * 22);
          });
          if (done.length === 3 && nextBtn.style.display === 'none') {
            ctx.fillStyle = '#141c2b'; ctx.font = '700 15px Inter, sans-serif';
            ctx.fillText(`Average: ${Math.round(r.avgStrength).toLocaleString()} psi`, 610, 440);
            nextBtn.style.display = '';
          } else if (done.length === 3) {
            ctx.fillStyle = '#141c2b'; ctx.font = '700 15px Inter, sans-serif';
            ctx.fillText(`Average: ${Math.round(r.avgStrength).toLocaleString()} psi`, 610, 440);
          }
        }
        raf = requestAnimationFrame(draw);
      };
      raf = requestAnimationFrame(draw);
    },
    unmount() { cancelAnimationFrame(raf); },
  };
};

// ── RESULTS: 결과 리포트 ──────────────────────────────────────────
Scenes.results = () => ({
  mount(root) {
    const r = game.result, m = game.mission, sc = r.score;
    // 최고 기록 갱신
    try {
      const best = bestScores();
      if (!best[m.id] || best[m.id] < sc.total) {
        best[m.id] = sc.total;
        localStorage.setItem('mixlab-best', JSON.stringify(best));
      }
    } catch (e) { /* 저장 불가 환경 무시 */ }

    const gradeColor = { A: 'var(--green)', B: 'var(--primary)', C: 'var(--amber)',
      D: 'var(--amber)', F: 'var(--red)' }[sc.grade];
    const row = (label, detail, pts, max) => h('div', { class: 'score-row' },
      h('div', { style: 'font-weight:600' }, label),
      h('div', {},
        h('div', { style: 'font-size:13px;color:var(--muted);margin-bottom:5px' }, detail),
        h('div', { class: 'score-bar' },
          h('div', { style: `width:${(pts / max) * 100}%;background:${pts === max ? 'var(--green)' : pts > 0 ? 'var(--amber)' : 'var(--red)'}` }))),
      h('div', { style: 'text-align:right;font-weight:700;font-variant-numeric:tabular-nums' },
        `${Math.round(pts)} / ${max}`));

    const target = E.targetAirFor(m, designToMix().nmas);
    root.append(
      h('h1', {}, 'Inspection report'),
      h('p', { class: 'sub' }, `${m.icon} ${m.name} — final verdict from the testing lab.`),
      h('div', { class: 'wizard-grid' },
        h('div', { class: 'card' },
          h('div', { style: 'display:flex;gap:22px;align-items:center;margin-bottom:14px' },
            h('div', { class: 'grade-badge', style: `background:${gradeColor}` }, sc.grade),
            h('div', {},
              h('div', { style: 'font-size:30px;font-weight:800' }, `${sc.total} / 100`),
              h('div', { style: 'font-size:20px;letter-spacing:2px;color:var(--amber)' },
                '★'.repeat(sc.stars) + '☆'.repeat(5 - sc.stars)))),
          row('Slump', `Measured ${r.measuredSlump.toFixed(2)} in. · required ${m.slumpRange[0]}–${m.slumpRange[1]} in.`,
            sc.slumpPts, 40),
          row('Strength', `Average ${Math.round(r.avgStrength).toLocaleString()} psi · required f'c ${m.fc.toLocaleString()} psi`,
            sc.strengthPts, 40),
          row('Air content', `Batched ${designToMix().airPct}%` + (target ? ` · target ${target}%` : ' · non-AE mix'),
            sc.airPts, 10),
          row('Yield', `Absolute volume ${r.yieldVol.toFixed(2)} cu ft · target 27.0 cu ft`,
            sc.yieldPts, 10),
          h('div', { class: 'wiz-nav' },
            h('button', { class: 'btn', onclick: () => { game.result = null; game.seed = Math.floor(Math.random() * 1e6); go('design'); } },
              '↻ Retry mission'),
            h('button', { class: 'btn btn-primary', onclick: () => { game.mission = null; go('home'); } },
              'New mission →'))),
        h('div', { class: 'ref-panel' },
          h('div', { class: 'card' },
            h('h2', {}, "Inspector's notes"),
            h('ul', { style: 'margin:8px 0 0;padding-left:18px;color:var(--muted)' },
              sc.notes.map(n => h('li', { style: 'margin-bottom:8px' }, n)))))));
  },
});

go('home');
</script>
